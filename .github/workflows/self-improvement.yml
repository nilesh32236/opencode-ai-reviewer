name: Autonomous Self-Improvement

# Runs weekly (or on-demand) to let the AI improve the codebase itself.
# Creates an improvement/ branch, runs pnpm build + test to verify, then
# opens a PR with label "self-improvement" so it gets reviewed (not auto-fixed).
#
# Enhanced with:
# - Structured Context7 & web search instructions for research-first improvements
# - Verification retry loop that feeds errors back to AI for self-correction
# - Graceful degradation when verification fails after retries

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly, Sunday midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

# Weekly runs are naturally serialised. cancel-in-progress: false so a manual
# dispatch doesn't kill a running scheduled run.
concurrency:
  group: self-improvement
  cancel-in-progress: false

env:
  CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}

jobs:
  self-improve:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: false
          # Do not persist the checkout token in the agent workspace. Trusted
          # push operations below use an ephemeral askpass helper.

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.8.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 (node24 line; runner floor ubuntu-24.04; engine floor Node >=24.19.0 — July 2026 HIGH CVE fixes)
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install

      - name: Setup OpenCode CLI
        run: |
          chmod +x .github/scripts/setup-opencode.sh
          .github/scripts/setup-opencode.sh

      - name: Write Self-Improvement Prompt
        run: |
          cat << 'PROMPT_EOF' > /tmp/self-improve-prompt.txt
          You are a Self-Improving AI Agent for the **OpenCode AI Reviewer** codebase.
          Your goal is to autonomously improve this repository by refactoring code,
          adding new features, improving workflows, updating workspace skills, or fixing bugs.

          ## Research & Context Enrichment (MANDATORY — do this FIRST)

          ### Step 1: Web Search for Current Best Practices
          Use the **websearch** tool to research these topics BEFORE making any changes:
          - "GitHub Actions self-healing CI/CD autonomous agent best practices 2026"
          - "TypeScript AI code review tool architecture patterns"
          - "Node.js ESM monorepo build optimization"
          - Search for any specific library updates relevant to your chosen improvement

          ### Step 2: Context7 MCP for Library Documentation
          Use **Context7 MCP** to check the latest APIs for libraries used in this project:
          1. Find the library ID: `npx ctx7@latest library <name> "<question>"`
          2. Query the docs: `npx ctx7@latest docs <libraryId> "<question>"`

          Libraries to check based on your improvement area:
          - **Probot**: For GitHub App webhook handling
          - **@actions/core, @actions/exec, @actions/github**: For GitHub Action wrappers
          - **better-sqlite3**: For the learning store database
          - **Vitest**: For unit testing patterns
          - **minimatch**: For glob pattern matching
          - **zod**: For schema validation

          **Never assume cached documentation is current. Always verify.**

          ### Step 3: Check Project Context
          - Read `.opencode-reviewer.yml` for project conventions
          - Read `.agents/AGENTS.md` for workspace rules
          - Check `CHANGELOG.md` to understand recent changes and avoid duplicating work

          ## Tasks to Perform — pick ONE or TWO well-scoped improvements
          - **Self-Healing Enhancements:** Improve error recovery, retry logic, circuit breakers,
            or failure diagnosis capabilities.
          - **Refactoring:** Enhance error boundaries, API rate-limit retries, SQLite
            transaction safety, or PR pagination.
          - **New Features:** Better diagnostic logging, new audit rules, test utilities,
            improved prompt templates.
          - **Agent Skills:** Create or enhance files under `.agents/skills/` or general
            project rules.
          - **Prompt Engineering:** Improve prompts under `.audit-prompts/` or `prompts/`
            to make AI audits and reviews more precise and actionable.
          - **Workflow Improvements:** Optimize GitHub Actions workflows for speed, reliability,
            or better error reporting.

          ## Code Conventions
          - **ESM imports**: All relative TS imports MUST end with `.js` extension
          - **No `any` type**: Use explicit interfaces everywhere
          - **Preserve docstrings**: Do not remove existing JSDoc comments
          - **Dependency flow**: lib → action, lib → app (rebuild after lib changes)

          ## Verification & Compilation Checklist (MANDATORY)
          After making all changes, run these commands in order and fix any errors:
          1. `pnpm build`      — must exit 0
          2. `pnpm typecheck`  — must exit 0
          3. `pnpm test`       — all tests must pass
          4. `pnpm lint`       — no errors (warnings are ok)

          If any step fails, diagnose the error output, fix the code, and re-run.
          Do NOT stop until all four commands pass.

          ## Output
          Write a concise summary of your improvements to `.improvement-summary.md`.
          Include:
          - What you researched (web search queries and Context7 docs checked)
          - What you changed and why
          - What tests or verifications you ran

          ## IMPORTANT — git operations
          Do NOT run git add / git commit / git push yourself.
          The workflow step after you finish will handle all git operations.
          PROMPT_EOF

      - name: Run OpenCode Self-Improvement
        run: |
          timeout 10m opencode run --auto --model "${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}" \
            "$(cat /tmp/self-improve-prompt.txt)" < /dev/null
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Verify and self-heal if needed
        id: verify
        run: |
          # Use the immutable workflow copy so the agent cannot replace the
          # verification environment helper in its checkout.
          isolated() {
            set -o pipefail
            if ! git -c core.hooksPath=/dev/null merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Refusing isolated verification: workflow SHA is not on the default-branch lineage." >&2
              return 2
            fi
            git -c core.hooksPath=/dev/null show "$GITHUB_SHA:.github/scripts/run-isolated.sh" |
              bash -s -- "$@"
          }
          MAX_RETRIES=3
          ATTEMPT=0
          VERIFIED=false

          while [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== Verification attempt ${ATTEMPT}/${MAX_RETRIES} ==="

            # Run all verification steps and collect all errors
            VERIFY_FAILED=""
            VERIFY_OUTPUT=""
            ALL_FAILURES=""

            BUILD_OUT=$(isolated pnpm build 2>&1) || ALL_FAILURES="${ALL_FAILURES}build: ${BUILD_OUT}"$'\n'
            TC_OUT=$(isolated pnpm typecheck 2>&1) || ALL_FAILURES="${ALL_FAILURES}typecheck: ${TC_OUT}"$'\n'
            TEST_OUT=$(isolated pnpm test 2>&1) || ALL_FAILURES="${ALL_FAILURES}test: ${TEST_OUT}"$'\n'
            LINT_OUT=$(isolated pnpm lint 2>&1) || ALL_FAILURES="${ALL_FAILURES}lint: ${LINT_OUT}"$'\n'

            if [ -n "$ALL_FAILURES" ]; then
              VERIFY_FAILED="verification"
              VERIFY_OUTPUT="$ALL_FAILURES"
            fi

            if [ -z "$VERIFY_FAILED" ]; then
              echo "✅ All checks passed on attempt ${ATTEMPT}"
              VERIFIED=true
              break
            fi

            echo "⚠️ ${VERIFY_FAILED} failed on attempt ${ATTEMPT}."

            if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
              echo "Feeding errors back to AI for self-correction..."

              # Truncate output to last 200 lines to avoid prompt overflow
              TRUNCATED_OUTPUT=$(echo "$VERIFY_OUTPUT" | tail -200)

              cat << FIX_EOF > /tmp/self-heal-fix-prompt.txt
          The self-improvement changes caused verification to fail at the "${VERIFY_FAILED}" step.
          Fix the errors below. Only fix what is broken — do not make unrelated changes.

          ## Error Output (${VERIFY_FAILED})
          \`\`\`
          ${TRUNCATED_OUTPUT}
          \`\`\`

          ## Research Before Fixing
          1. Use **websearch** to look up the error message if it's unfamiliar.
          2. Use **Context7 MCP** to check API docs if the error involves a library.

          ## Code Rules
          - ESM imports must end with .js extension
          - No 'any' type — use explicit interfaces
          - Preserve existing docstrings and comments

          ## After fixing, run verification again:
          1. pnpm build
          2. pnpm typecheck
          3. pnpm test
          4. pnpm lint

          Do NOT run git add/commit/push.
          FIX_EOF

              env -u GITHUB_TOKEN -u GH_TOKEN -u GIT_ASKPASS -u GIT_TERMINAL_PROMPT \
                timeout 10m opencode run --auto --model "${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}" \
                "$(cat /tmp/self-heal-fix-prompt.txt)" < /dev/null || true
            fi
          done

          echo "verified=$VERIFIED" >> "$GITHUB_OUTPUT"
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Ensure self-improvement and review labels exist
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh label create "self-improvement" \
            --force --color "7057ff" \
            --description "Autonomous self-improvement PR — review before merging" \
            -R "${{ github.repository }}" 2>/dev/null || true
          gh label create "autofix:needs-manual-review" \
            --force --color "d93f0b" \
            --description "Max iterations reached or verification failed" \
            -R "${{ github.repository }}" 2>/dev/null || true

      - name: Prepare self-improvement changes
        id: prepare
        run: |
          # No GitHub token is present in this step. Keep all local git
          # operations token-free and disable hooks because the workspace is
          # controlled by the agent.
          if [ -z "$(git status --porcelain)" ]; then
            echo "No improvements or changes made — skipping PR creation."
            exit 0
          fi

          BRANCH="improvement/run-${{ github.run_id }}"
          SUMMARY_FILE="/tmp/self-improvement-summary.md"
          rm -f "$SUMMARY_FILE"
          if [ -f .improvement-summary.md ]; then
            cp .improvement-summary.md "$SUMMARY_FILE"
          else
            printf '%s\n' "The self-improving agent made changes." > "$SUMMARY_FILE"
          fi

          git -c core.hooksPath=/dev/null config --local user.name "nilesh32236"
          git -c core.hooksPath=/dev/null config --local user.email "nilesh32236@gmail.com"
          git -c core.hooksPath=/dev/null checkout -b "$BRANCH"
          if [ -f .improvement-summary.md ]; then
            git -c core.hooksPath=/dev/null rm .improvement-summary.md
          fi
          env -u GH_TOKEN -u GITHUB_TOKEN -u GIT_ASKPASS -u GIT_TERMINAL_PROMPT \
            git -c core.hooksPath=/dev/null add -A
          env -u GH_TOKEN -u GITHUB_TOKEN -u GIT_ASKPASS -u GIT_TERMINAL_PROMPT \
            git -c core.hooksPath=/dev/null commit --no-verify -m "feat(improvement): autonomous codebase enhancement [run ${{ github.run_id }}]"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Push and create self-improvement PR
        if: steps.prepare.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          VERIFIED: ${{ steps.verify.outputs.verified }}
        run: |
          # Authentication is ephemeral and only present in this trusted step.
          # Read the helper from the immutable workflow SHA, never from the
          # agent-controlled checkout, and keep repository hooks disabled.
          trusted_git() {
            set -o pipefail
            if ! git -c core.hooksPath=/dev/null merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Refusing trusted git: workflow SHA is not on the default-branch lineage." >&2
              return 2
            fi
            git -c core.hooksPath=/dev/null show "$GITHUB_SHA:.github/scripts/trusted-git.sh" |
              GH_TOKEN="$GH_TOKEN" bash -s -- "$@"
          }
          trusted_git push --no-verify origin "$BRANCH" --force-with-lease

          SUMMARY="$(cat /tmp/self-improvement-summary.md)"
          if [ "$VERIFIED" = "true" ]; then
            VERIFY_STATUS="### ✅ Verification Passed\nAll checks (build, typecheck, test, lint) passed."
            LABELS="self-improvement"
          else
            VERIFY_STATUS="### ⚠️ Verification Issues\nSome checks may have failed after retry attempts. **Manual review is required.**"
            LABELS="self-improvement,autofix:needs-manual-review"
          fi

          PR_BODY="$(printf '## 🤖 Autonomous Codebase Enhancement\n\n%s\n\n%s\n\n---\n\n> **Review required** — This PR was generated autonomously. Please review the changes before merging.\n> Run ID: `%s`' "$SUMMARY" "$(echo -e "$VERIFY_STATUS")" "${{ github.run_id }}")"

          gh pr create \
            --title "[Self-Improvement] Autonomous Codebase Enhancement" \
            --body "$PR_BODY" \
            --label "$LABELS" \
            --head "$BRANCH" \
            --base main \
            --repo "${{ github.repository }}"
