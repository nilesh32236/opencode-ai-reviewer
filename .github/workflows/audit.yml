# ─── Reusable Workflow: AI Codebase Audit ───
# Usage:
#   jobs:
#     audit:
#       uses: nilesh32236/opencode-ai-reviewer/.github/workflows/audit.yml@v1
#       secrets: inherit
#
# Required secrets:
#   - repo_token: GitHub token with issues:write, pull-requests:write
# Optional secrets (for non-default models):
#   - OPENAI_API_KEY
#   - ANTHROPIC_API_KEY
#   - GEMINI_API_KEY

name: AI Codebase Audit

on:
  workflow_call:
    inputs:
      model:
        description: 'OpenCode model to use'
        required: false
        type: string
        default: 'opencode/deepseek-v4-flash-free'
      prompt_name:
        description: 'Specific audit category (omit for random)'
        required: false
        type: string
      target_dir:
        description: 'Specific directory to audit (omit for random)'
        required: false
        type: string
      create_issues:
        description: 'Create GitHub issues from findings'
        required: false
        type: boolean
        default: true
      auto_fix:
        description: 'Auto-trigger fix workflow'
        required: false
        type: boolean
        default: true
    outputs:
      critical_count:
        value: ${{ jobs.audit.outputs.critical_count }}
      important_count:
        value: ${{ jobs.audit.outputs.important_count }}
    secrets:
      repo_token:
        description: 'GitHub token with issues:write, pull-requests:write'
        required: true
      OPENAI_API_KEY:
        description: 'OpenAI API key (required when using OpenAI models)'
        required: false
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key (required when using Anthropic models)'
        required: false
      GEMINI_API_KEY:
        description: 'Google Gemini API key (required when using Gemini models)'
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      critical_count: ${{ steps.ai-audit.outputs.critical_count }}
      important_count: ${{ steps.ai-audit.outputs.important_count }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate API key secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if echo "${{ inputs.model }}" | grep -qiE 'openai|gpt'; then
            [ -n "$OPENAI_API_KEY" ] || echo "::warning::OPENAI_API_KEY secret is not configured — OpenAI models will fail to authenticate"
          fi
          if echo "${{ inputs.model }}" | grep -qiE 'anthropic|claude'; then
            [ -n "$ANTHROPIC_API_KEY" ] || echo "::warning::ANTHROPIC_API_KEY secret is not configured — Anthropic models will fail to authenticate"
          fi
          if echo "${{ inputs.model }}" | grep -qiE 'gemini'; then
            [ -n "$GEMINI_API_KEY" ] || echo "::warning::GEMINI_API_KEY secret is not configured — Gemini models will fail to authenticate"
          fi

      - name: AI Audit
        id: ai-audit
        uses: nilesh32236/opencode-ai-reviewer@v1
        with:
          mode: audit
          model: ${{ inputs.model }}
          audit_prompt_file: ${{ inputs.prompt_name }}
          audit_target_dir: ${{ inputs.target_dir }}
          audit_create_issues: ${{ inputs.create_issues }}
          audit_auto_fix: ${{ inputs.auto_fix }}
          github_token: ${{ secrets.repo_token }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}