# ─── Reusable Workflow: AI Autofix Review Loop ───
# Usage:
#   jobs:
#     autofix:
#       uses: nilesh32236/opencode-ai-reviewer/.github/workflows/autofix.yml@v1
#       secrets: inherit
#
# Required secrets:
#   - repo_token: GitHub token with contents:write, pull-requests:write, issues:write
# Optional secrets (for non-default models):
#   - OPENAI_API_KEY
#   - ANTHROPIC_API_KEY
#   - GEMINI_API_KEY
#
# ⚠️ Migration (breaking change): Passing `openai_api_key`, `anthropic_api_key`,
# or `gemini_api_key` via `with:` is no longer supported — such calls fail
# validation with "Unexpected input(s)". Remove them from `with:` and supply the
# keys via `secrets: inherit` or an explicit `secrets:` mapping
# (`OPENAI_API_KEY`, `ANTHROPIC_API_KEY`, `GEMINI_API_KEY`).

name: AI Autofix Loop

on:
  workflow_call:
    inputs:
      model:
        description: 'OpenCode model to use'
        required: false
        type: string
        default: 'opencode/deepseek-v4-flash-free'
      max_iterations:
        description: 'Max review-fix iterations'
        required: false
        type: number
        default: 3
      auto_merge:
        description: 'Auto-merge approved PRs'
        required: false
        type: boolean
        default: true
      run_checks:
        description: 'Commands to run after fix (space-separated, && joined)'
        required: false
        type: string
        default: ''
    outputs:
      approved:
        description: 'Whether the PR was approved'
        value: ${{ jobs.review.outputs.approved }}
    secrets:
      repo_token:
        description: 'GitHub token with contents:write, pull-requests:write, issues:write'
        required: true
      OPENAI_API_KEY:
        description: 'OpenAI API key (required when using OpenAI models)'
        required: false
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key (required when using Anthropic models)'
        required: false
      GEMINI_API_KEY:
        description: 'Google Gemini API key (required when using Gemini models)'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: autofix-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # ── Job 1: Review ──
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    outputs:
      approved: ${{ steps.ai-review.outputs.verdict }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Validate API key secrets
        uses: nilesh32236/opencode-ai-reviewer/.github/actions/validate-api-keys@v1
        with:
          model: ${{ inputs.model }}

      - name: AI Review
        id: ai-review
        uses: nilesh32236/opencode-ai-reviewer@v1
        with:
          mode: review
          model: ${{ inputs.model }}
          github_token: ${{ secrets.repo_token }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

  # ── Job 2: Fix ──
  fix:
    needs: [review]
    if: always() && needs.review.result == 'success' && needs.review.outputs.approved != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Validate API key secrets
        uses: nilesh32236/opencode-ai-reviewer/.github/actions/validate-api-keys@v1
        with:
          model: ${{ inputs.model }}

      - name: AI Fix
        id: ai-fix
        uses: nilesh32236/opencode-ai-reviewer@v1
        with:
          mode: fix
          model: ${{ inputs.model }}
          max_fix_iterations: ${{ inputs.max_iterations }}
          run_checks_after_fix: ${{ inputs.run_checks }}
          github_token: ${{ secrets.repo_token }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

  # ── Job 3: Auto-merge ──
  auto-merge:
    needs: [review]
    if: needs.review.result == 'success' && needs.review.outputs.approved == 'true' && inputs.auto_merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Enable Auto-merge
        env:
          GH_TOKEN: ${{ secrets.repo_token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          gh pr merge "$PR_NUMBER" --squash --delete-branch 2>/dev/null || \
          gh pr merge "$PR_NUMBER" --squash --auto --delete-branch || {
            echo "::warning::Merge failed — PR may need manual merge"
          }