# ─── Reusable Workflow: AI Autofix Review Loop ───
# Usage:
#   jobs:
#     autofix:
#       uses: nilesh32236/opencode-ai-reviewer/.github/workflows/autofix.yml@v1
#       secrets: inherit
#
# Required secrets:
#   - repo_token: GitHub token with contents:write, pull-requests:write, issues:write
# Optional secrets (for non-default models):
#   - OPENAI_API_KEY
#   - ANTHROPIC_API_KEY
#   - GEMINI_API_KEY

name: AI Autofix Loop

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (optional, auto-resolved if empty)'
        required: false
        type: string
        default: ''
      model:
        description: 'OpenCode model to use'
        required: false
        type: string
        default: 'opencode/deepseek-v4-flash-free'
      max_iterations:
        description: 'Max review-fix iterations'
        required: false
        type: number
        default: 3
      auto_merge:
        description: 'Auto-merge approved PRs'
        required: false
        type: boolean
        default: true
      run_checks:
        description: 'Commands to run after fix (space-separated, && joined)'
        required: false
        type: string
        default: ''
      git_user_name:
        description: 'Git user name for fix commits (default: triggering actor)'
        required: false
        type: string
        default: ''
      git_user_email:
        description: 'Git user email for fix commits (default: actor noreply email)'
        required: false
        type: string
        default: ''
    outputs:
      approved:
        description: 'Whether the PR was approved'
        value: ${{ jobs.review.outputs.approved }}
    secrets:
      repo_token:
        description: 'GitHub token with contents:write, pull-requests:write, issues:write'
        required: true
      OPENAI_API_KEY:
        description: 'OpenAI API key (required when using OpenAI models)'
        required: false
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key (required when using Anthropic models)'
        required: false
      GEMINI_API_KEY:
        description: 'Google Gemini API key (required when using Gemini models)'
        required: false
      OPENCODE_API_KEY:
        description: 'OpenCode gateway API key (required when using opencode-go/* models)'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: autofix-${{ github.event.pull_request.number || github.event.issue.number || github.sha }}
  cancel-in-progress: false

jobs:
  # ── Job 1: Review ──
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      approved: ${{ steps.ai-review.outputs.verdict }}

    steps:
      - name: Resolve Git ref
        id: resolve-ref
        env:
          GH_TOKEN: ${{ secrets.repo_token || secrets.GITHUB_TOKEN }}
        run: |
          INPUT_REF="${{ inputs.ref }}"
          PR_REF="${{ github.event.pull_request.head.ref }}"
          if [ -n "$INPUT_REF" ]; then
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          elif [ -n "$PR_REF" ]; then
            echo "ref=$PR_REF" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issue_comment" ] && [ -n "${{ github.event.issue.pull_request }}" ]; then
            PR_NUMBER="${{ github.event.issue.number }}"
            REF=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName --jq .headRefName 2>/dev/null || echo "")
            if [ -n "$REF" ]; then
              echo "ref=$REF" >> "$GITHUB_OUTPUT"
            else
              echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.resolve-ref.outputs.ref }}

      - name: Validate API key secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if echo "${{ inputs.model }}" | grep -qiE 'openai|gpt'; then
            [ -n "$OPENAI_API_KEY" ] || echo "::warning::OPENAI_API_KEY secret is not configured — OpenAI models will fail to authenticate"
          fi
          if echo "${{ inputs.model }}" | grep -qiE 'anthropic|claude'; then
            [ -n "$ANTHROPIC_API_KEY" ] || echo "::warning::ANTHROPIC_API_KEY secret is not configured — Anthropic models will fail to authenticate"
          fi
          if echo "${{ inputs.model }}" | grep -qiE 'gemini'; then
            [ -n "$GEMINI_API_KEY" ] || echo "::warning::GEMINI_API_KEY secret is not configured — Gemini models will fail to authenticate"
          fi
          if echo "${{ inputs.model }}" | grep -qiE 'opencode-go'; then
            [ -n "$OPENCODE_API_KEY" ] || echo "::warning::OPENCODE_API_KEY secret is not configured — opencode-go/* models will fail to authenticate"
          fi

      - name: AI Review
        id: ai-review
        uses: nilesh32236/opencode-ai-reviewer@v1
        with:
          mode: review
          model: ${{ inputs.model }}
          github_token: ${{ secrets.repo_token }}
          git_user_name: ${{ inputs.git_user_name }}
          git_user_email: ${{ inputs.git_user_email }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          opencode_api_key: ${{ secrets.OPENCODE_API_KEY }}

  # ── Job 2: Fix ──
  fix:
    needs: [review]
    if: always() && needs.review.result == 'success' && needs.review.outputs.approved != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve Git ref
        id: resolve-ref
        env:
          GH_TOKEN: ${{ secrets.repo_token || secrets.GITHUB_TOKEN }}
        run: |
          INPUT_REF="${{ inputs.ref }}"
          PR_REF="${{ github.event.pull_request.head.ref }}"
          if [ -n "$INPUT_REF" ]; then
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          elif [ -n "$PR_REF" ]; then
            echo "ref=$PR_REF" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issue_comment" ] && [ -n "${{ github.event.issue.pull_request }}" ]; then
            PR_NUMBER="${{ github.event.issue.number }}"
            REF=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName --jq .headRefName 2>/dev/null || echo "")
            if [ -n "$REF" ]; then
              echo "ref=$REF" >> "$GITHUB_OUTPUT"
            else
              echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.resolve-ref.outputs.ref }}

      - name: Validate API key secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if echo "${{ inputs.model }}" | grep -qiE 'openai|gpt'; then
            [ -n "$OPENAI_API_KEY" ] || echo "::warning::OPENAI_API_KEY secret is not configured — OpenAI models will fail to authenticate"
          fi
          if echo "${{ inputs.model }}" | grep -qiE 'anthropic|claude'; then
            [ -n "$ANTHROPIC_API_KEY" ] || echo "::warning::ANTHROPIC_API_KEY secret is not configured — Anthropic models will fail to authenticate"
          fi
          if echo "${{ inputs.model }}" | grep -qiE 'gemini'; then
            [ -n "$GEMINI_API_KEY" ] || echo "::warning::GEMINI_API_KEY secret is not configured — Gemini models will fail to authenticate"
          fi
          if echo "${{ inputs.model }}" | grep -qiE 'opencode-go'; then
            [ -n "$OPENCODE_API_KEY" ] || echo "::warning::OPENCODE_API_KEY secret is not configured — opencode-go/* models will fail to authenticate"
          fi

      - name: AI Fix
        id: ai-fix
        uses: nilesh32236/opencode-ai-reviewer@v1
        with:
          mode: fix
          model: ${{ inputs.model }}
          max_fix_iterations: ${{ inputs.max_iterations }}
          run_checks_after_fix: ${{ inputs.run_checks }}
          github_token: ${{ secrets.repo_token }}
          git_user_name: ${{ inputs.git_user_name }}
          git_user_email: ${{ inputs.git_user_email }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          opencode_api_key: ${{ secrets.OPENCODE_API_KEY }}

  # ── Job 3: Auto-merge ──
  auto-merge:
    needs: [review]
    if: needs.review.result == 'success' && needs.review.outputs.approved == 'true' && inputs.auto_merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Enable Auto-merge
        env:
          GH_TOKEN: ${{ secrets.repo_token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          gh pr merge "$PR_NUMBER" --squash --delete-branch 2>/dev/null || \
          gh pr merge "$PR_NUMBER" --squash --auto --delete-branch || {
            echo "::warning::Merge failed — PR may need manual merge"
          }