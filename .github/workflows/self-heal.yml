# ─── Self-Healing Workflow ───────────────────────────────────────────────────
# Triggers when CI fails on main, diagnoses the failure, applies a fix,
# and opens a PR for review. Implements the "Detect → Diagnose → Fix → Verify"
# loop entirely through GitHub Actions.
#
# Also watches for failed autofix PRs that were merged with issues, and
# self-improvement runs that break the build.

name: Self-Heal CI

on:
  # Trigger when the CI workflow completes (success or failure)
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      failure_logs:
        description: 'CI failure logs (paste error output)'
        required: false
        type: string
      failed_step:
        description: 'Name of the CI step that failed'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

# Only one heal attempt at a time
concurrency:
  group: self-heal-ci
  cancel-in-progress: false

env:
  CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}

jobs:
  detect-and-heal:
    # Only run when CI failed (or manual dispatch)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "opencode-ai-reviewer[bot]"
          git config --global user.email "opencode-ai-reviewer[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm & dependencies
        run: |
          npm install -g pnpm
          pnpm install

      - name: Check for existing heal PR
        id: check-existing
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --repo "${{ github.repository }}" --label "self-heal" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "existing_pr=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "A self-heal PR #${EXISTING} is already open — skipping new heal attempt."
          else
            echo "existing_pr=" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture CI failure logs
        if: steps.check-existing.outputs.existing_pr == ''
        id: capture-logs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          INPUT_FAILURE_LOGS: ${{ inputs.failure_logs }}
          INPUT_FAILED_STEP: ${{ inputs.failed_step }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_FAILURE_LOGS" ]; then
            printf '%s\n' "$INPUT_FAILURE_LOGS" > /tmp/ci-failure-logs.txt
            FAILED_STEP_VAL="${INPUT_FAILED_STEP:-unknown}"
            echo "failed_step=${FAILED_STEP_VAL}" >> "$GITHUB_OUTPUT"
            echo "failed_workflow=manual" >> "$GITHUB_OUTPUT"
          else
            # Fetch logs from the failed workflow run
            RUN_ID="${{ github.event.workflow_run.id }}"
            WORKFLOW_NAME="${{ github.event.workflow_run.name }}"

            echo "Fetching logs for workflow run #${RUN_ID} (${WORKFLOW_NAME})..."

            # Download the logs for the failed run
            gh run view "$RUN_ID" --repo "${{ github.repository }}" --log 2>/dev/null > /tmp/ci-failure-logs.txt || true

            if [ ! -s /tmp/ci-failure-logs.txt ]; then
              # Fallback: get the run summary
              gh run view "$RUN_ID" --repo "${{ github.repository }}" 2>/dev/null > /tmp/ci-failure-logs.txt || true
            fi

            # Try to identify the failed step
            FAILED_STEP=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json jobs --jq '.jobs[] | select(.conclusion == "failure") | .steps[] | select(.conclusion == "failure") | .name' 2>/dev/null | head -1 || echo "unknown")

            echo "failed_step=${FAILED_STEP}" >> "$GITHUB_OUTPUT"
            echo "failed_workflow=${WORKFLOW_NAME}" >> "$GITHUB_OUTPUT"
          fi

          # Verify we have log content
          if [ ! -s /tmp/ci-failure-logs.txt ]; then
            echo "::warning::Could not capture CI failure logs"
            echo "CI workflow failed but no logs could be captured." > /tmp/ci-failure-logs.txt
          fi

          LOGS=$(cat /tmp/ci-failure-logs.txt)
          echo "logs_captured=true" >> "$GITHUB_OUTPUT"
          echo "logs_content<<EOF_LOGS" >> "$GITHUB_OUTPUT"
          echo "$LOGS" >> "$GITHUB_OUTPUT"
          echo "EOF_LOGS" >> "$GITHUB_OUTPUT"
          echo "Captured $(wc -c < /tmp/ci-failure-logs.txt) bytes of failure logs"

      - name: Run self-heal
        if: steps.check-existing.outputs.existing_pr == '' && steps.capture-logs.outputs.logs_captured == 'true'
        uses: ./action
        with:
          mode: self-heal
          model: 'opencode/deepseek-v4-flash-free'
          ci_failure_logs: ${{ steps.capture-logs.outputs.logs_captured == 'true' && steps.capture-logs.outputs.logs_content || '' }}
          failed_step: ${{ steps.capture-logs.outputs.failed_step }}
          failed_workflow: ${{ steps.capture-logs.outputs.failed_workflow }}
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
        env:
          # Pass the logs via environment variable since they can be large
          CI_FAILURE_LOGS_FILE: /tmp/ci-failure-logs.txt

      - name: Fallback self-heal via OpenCode CLI
        if: steps.check-existing.outputs.existing_pr == '' && steps.capture-logs.outputs.logs_captured == 'true' && failure()
        run: |
          npm install -g opencode-cli@latest

          FAILURE_LOGS=$(cat /tmp/ci-failure-logs.txt | head -500)
          FAILED_STEP="${{ steps.capture-logs.outputs.failed_step }}"
          FAILED_WORKFLOW="${{ steps.capture-logs.outputs.failed_workflow }}"

          cat <<PROMPT_EOF > /tmp/self-heal-prompt.txt
          You are a Self-Healing CI Agent. The CI pipeline "${FAILED_WORKFLOW}" failed at step "${FAILED_STEP}".

          ## CI Failure Logs
          \`\`\`
          ${FAILURE_LOGS}
          \`\`\`

          ## Research Instructions (MANDATORY)
          1. Use **Context7 MCP** to check the latest API docs for any libraries mentioned in the errors.
          2. Use **websearch** to search for the exact error message and find solutions.
          3. Check GitHub issues for the relevant packages.

          ## Fix Instructions
          1. Diagnose the root cause from the error logs
          2. Fix the issue in the source code
          3. Run verification: pnpm build && pnpm typecheck && pnpm test && pnpm lint
          4. If verification fails, fix the new errors and re-run

          ## IMPORTANT
          - ESM imports must end with .js extension
          - No 'any' type - use explicit interfaces
          - Do NOT run git add/commit/push
          PROMPT_EOF

          opencode run --auto --model opencode/deepseek-v4-flash-free \
            "$(cat /tmp/self-heal-prompt.txt)" < /dev/null || true

          # Verify
          pnpm build && pnpm typecheck && pnpm test && pnpm lint || true

          # Commit and push if there are changes
          if [ -n "$(git status --porcelain)" ]; then
            BRANCH="fix/ci-heal-${{ github.run_id }}"
            git checkout -b "$BRANCH"
            git add -A
            git commit -m "fix: self-heal CI failure (fallback) [${FAILED_STEP}]"
            git push origin "$BRANCH" --force-with-lease

            gh label create "self-heal" --force --color "d73a49" \
              --description "Automated CI failure fix" \
              -R "${{ github.repository }}" 2>/dev/null || true

            gh pr create \
              --title "[Self-Heal] Fix CI failure in ${FAILED_WORKFLOW}" \
              --body "## 🩺 Self-Heal (Fallback)\n\nAutomated fix for CI failure in \`${FAILED_WORKFLOW}\` at step \`${FAILED_STEP}\`.\n\n> **Review required** before merging." \
              --label "self-heal,autofix" \
              --head "$BRANCH" \
              --base main \
              --repo "${{ github.repository }}" || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
