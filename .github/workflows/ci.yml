name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for committed build artifacts
        run: |
          ARTIFACTS=$(git ls-files 'lib/tests/*.test.js' 'lib/tests/*.test.d.ts' 'lib/tests/benchmarks/*.js' 'lib/tests/benchmarks/*.d.ts' 'lib/vitest.config.d.ts' 'lib/vitest.benchmark.config.js' 'lib/vitest.benchmark.config.d.ts')
          if [ -n "$ARTIFACTS" ]; then
            echo "ERROR: Compiled test artifacts committed:" >&2
            echo "$ARTIFACTS" >&2
            exit 1
          fi

      - name: Build lib
        run: pnpm --filter @opencode-pr-agent/lib build

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Verify Docstring Coverage
        run: pnpm doc:check

      - name: Unit tests
        run: pnpm test

      - name: Build action
        run: pnpm --filter @opencode-pr-agent/action build

      - name: Verify dist
        run: |
          test -f lib/dist/index.js || { echo "lib/dist/index.js missing!"; exit 1; }
          test -f action/lib/index.js || { echo "action/lib/index.js missing!"; exit 1; }
          echo "Build artifacts verified."

      - name: Check no duplicate action.yml
        run: |
          DUPES=$(find . -name 'action.yml' -not -path './action.yml' \
            -not -path './node_modules/*' -not -path '*/node_modules/*' \
            -not -path './.git/*' 2>/dev/null)
          if [ -n "$DUPES" ]; then
            echo "ERROR: duplicate action.yml files found. The root action.yml is the single source of truth." >&2
            echo "$DUPES" >&2
            exit 1
          fi
          echo "No duplicate action.yml files found."

  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - name: Build lib
        run: pnpm --filter @opencode-pr-agent/lib build
      - run: pnpm test -- --coverage

      - name: Check coverage thresholds
        run: |
          echo "Coverage report generated. See details in the test output above."

  benchmarks:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check benchmark code
        run: pnpm --filter @opencode-pr-agent/lib bench:typecheck

      - name: Run benchmarks
        run: pnpm --filter @opencode-pr-agent/lib bench

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            lib/bench-results.json
            lib/bench-metrics.json
          if-no-files-found: error

      - name: Check performance budgets
        run: pnpm --filter @opencode-pr-agent/lib exec tsx tests/benchmarks/reporter.ts