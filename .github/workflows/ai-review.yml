name: AI Multi-Agent Review

on:
  pull_request:
    types: [opened, synchronize, labeled, closed]
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      fast_review:
        description: Run a fast experimental single-pass review
        type: boolean
        default: false

# Least privilege (issue #548): jobs declare their own scopes below; the
# top-level default is read-only.
permissions:
  contents: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number || github.sha }}-${{ github.actor }}
  cancel-in-progress: false

jobs:
  fix-issue:
    name: Fix audit issue
    permissions:
      contents: write
      pull-requests: write
      issues: write
    if: github.event.issue && github.event.issue.pull_request == null && ((github.event_name == 'issues' && github.event.label.name == 'autofix-trigger') || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/fix')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure required labels exist
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh label create autofix --force --color 243cd4 --description 'PR created by AI fix agent' 2>/dev/null || true
          gh label create autofix:ready --force --color 0e8a16 --description 'Approved by AI reviewer — ready to merge' 2>/dev/null || true
          gh label create autofix:needs-fix --force --color e4e669 --description 'AI fix produced changes that need another review cycle' 2>/dev/null || true
          gh label create autofix:needs-manual-review --force --color d93f0b --description 'Max fix iterations reached — needs human review' 2>/dev/null || true
          gh label create autofix-trigger --force --color c2e0c6 --description 'Triggers autofix workflow on issues' 2>/dev/null || true

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 (node24 line; runner floor ubuntu-24.04; engine floor Node >=24.19.0 — July 2026 HIGH CVE fixes)
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Fix issue
        uses: ./
        env:
          JEV_ENABLED: 'true'
        with:
          mode: fix
          opencode_version: 'v1.18.31'
          require_opencode_checksum: 'true'
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.issue.number }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          opencode_api_key: ${{ secrets.OPENCODE_API_KEY }}
          git_user_name: nilesh32236
          git_user_email: nilesh32236@gmail.com
          model: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          enable_mcp: false
          max_fix_iterations: 1
          run_checks_after_fix: 'pnpm build && pnpm typecheck && pnpm test && pnpm lint && pnpm doc:check'
          project_context: |
            TypeScript/pnpm monorepo. The repo IS the GitHub Action: action.yml at root bundles lib/* and cli/* into action/lib/index.js (node24). Do not modify generated bundles unless rebuild is required. Verification order: 1) pnpm install, 2) pnpm build, 3) pnpm typecheck, 4) pnpm test, 5) pnpm lint (biome). Keep changes backward-compatible and additive; never break the action input schema or drop support.

  review:
    name: AI Code Review
    permissions:
      pull-requests: write
    if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'autofix/') && !contains(fromJson('["github-actions[bot]","opencode-ai-reviewer[bot]","dependabot[bot]"]'), github.actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 (node24 line; runner floor ubuntu-24.04; engine floor Node >=24.19.0 — July 2026 HIGH CVE fixes)
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Review pull request
        uses: ./
        env:
          # TEMPORARY test (PR #696): remove after Jev shadow verification.
          JEV_ENABLED: 'true'
          JEV_MODEL: 'jev-1.13-free'
        with:
          mode: review
          opencode_version: 'v1.18.31'
          require_opencode_checksum: 'true'
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          opencode_api_key: ${{ secrets.OPENCODE_API_KEY }}
          model: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          enable_mcp: false
          enable_meta_verification: 'true'
          project_context: |
            TypeScript/pnpm monorepo. The repo IS the GitHub Action: action.yml at root bundles lib/* and cli/* into action/lib/index.js (node24). Review focuses on lib/ core behavior, action.yml input/output contract, and CLI surface. Verification: pnpm build, pnpm typecheck, pnpm test, pnpm lint.
          include_strengths: true
          review_inline: true

  fast-review:
    name: Fast review (experimental)
    permissions: {}
    if: github.event_name == 'workflow_dispatch' && inputs.fast_review == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: ai-fast-review-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 (node24 line; runner floor ubuntu-24.04; engine floor Node >=24.19.0 — July 2026 HIGH CVE fixes)
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Fast review
        id: fast-review
        uses: ./
        env:
          JEV_ENABLED: 'true'
        with:
          mode: review
          opencode_version: 'v1.18.31'
          require_opencode_checksum: 'true'
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          opencode_api_key: ${{ secrets.OPENCODE_API_KEY }}
          model: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          enable_mcp: false
          timeout_minutes: 10
          project_context: |
            Fast experimental single-pass review. Report only, no code changes. TypeScript/pnpm monorepo; this repo IS the GitHub Action (action.yml at root, bundles into action/lib/index.js).
          include_strengths: false
          review_inline: false
          review_comment_summary: true

      - name: Log duration
        run: echo "fast-review model=${{ steps.fast-review.outputs.model_used }} duration_ms=${{ steps.fast-review.outputs.duration_ms }}"

  autofix:
    name: Autofix review loop
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # The issue_comment (/fix) path additionally requires a privileged author
    # (OWNER/MEMBER/COLLABORATOR, mirroring app/src/utils/privilege.ts):
    # otherwise any GitHub user could spend model budget and run the
    # secret-bearing fix loop (GH_PAT + LLM keys) on any PR (issue #540).
    # The pull_request path additionally requires a same-repo head (fork PRs
    # fail closed in resolve-ref too, but never start the job at all).
    if: github.event_name != 'schedule' && github.event.action != 'closed' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'autofix') && !contains(github.event.pull_request.labels.*.name, 'autofix:approved') && !contains(github.event.pull_request.labels.*.name, 'autofix:merged') && !contains(github.event.pull_request.labels.*.name, 'autofix:ready')) || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '/fix') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: ai-autofix-loop-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Resolve pull request ref
        id: resolve-ref
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            PR_REF="$(gh pr view "$ISSUE_NUMBER" --repo "$REPO" --json headRefName --jq '.headRefName')"
            PR_SHA="$(gh pr view "$ISSUE_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
            IS_FORK="$(gh pr view "$ISSUE_NUMBER" --repo "$REPO" --json isCrossRepository --jq '.isCrossRepository')"
          else
            PR_REF="$PR_HEAD_REF"
            PR_SHA="$PR_HEAD_SHA"
            if [ "$PR_HEAD_REPO" = "$REPO" ]; then IS_FORK="false"; else IS_FORK="true"; fi
          fi
          # Fail closed: fork PRs must never enter the secret-bearing fix
          # loop, and an unresolvable SHA must never fall back to a mutable
          # branch ref (TOCTOU between review/checkout/push, issue #542).
          if [ "$IS_FORK" = "true" ]; then
            echo "::error::Refusing to run secret-bearing autofix on cross-repository PR."
            exit 1
          fi
          if [ -z "$PR_SHA" ]; then
            echo "::error::Could not resolve PR head SHA; refusing mutable-ref checkout."
            exit 1
          fi
          echo "ref=${PR_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ steps.resolve-ref.outputs.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 (node24 line; runner floor ubuntu-24.04; engine floor Node >=24.19.0 — July 2026 HIGH CVE fixes)
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Autofix review loop
        uses: ./
        env:
          JEV_ENABLED: 'true'
        with:
          mode: fix
          opencode_version: 'v1.18.31'
          require_opencode_checksum: 'true'
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          opencode_api_key: ${{ secrets.OPENCODE_API_KEY }}
          git_user_name: nilesh32236
          git_user_email: nilesh32236@gmail.com
          model: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          enable_mcp: false
          enable_fix: true
          max_fix_iterations: 3
          run_checks_after_fix: 'pnpm build && pnpm typecheck && pnpm test && pnpm lint && pnpm doc:check'
          project_context: |
            TypeScript/pnpm monorepo. The repo IS the GitHub Action: action.yml at root bundles lib/* and cli/* into action/lib/index.js (node24). Do not modify generated bundles unless rebuild is required. Verification order: 1) pnpm install, 2) pnpm build, 3) pnpm typecheck, 4) pnpm test, 5) pnpm lint (biome). Keep changes backward-compatible and additive; never break the action input schema or drop support.

  # Merge only after every check run is green. This repo enables no branch
  # protection, so `gh pr merge --auto` would merge immediately regardless of
  # CI state (this previously merged a PR with failing docstring coverage).
  # The job therefore polls statusCheckRollup itself (up to ~20 min) and
  # performs a direct merge only on full green. Anything else is a warning
  # (the hourly orchestrator retries later).
  auto-merge:
    name: Auto-merge autofix PR
    permissions:
      contents: write
      pull-requests: write
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && contains(github.event.pull_request.labels.*.name, 'autofix:ready') && !github.event.pull_request.merged
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Merge autofix PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          # Checks that must be SUCCESS (substring match) for the merge to
          # proceed. Everything else must at worst be neutral — failures
          # anywhere block. SKIPPED required checks block: skipped != verified
          # (this previously merged PRs whose CI never ran).
          REQUIRED='["test (24)","benchmarks","coverage","Analyze (javascript-typescript)","CodeQL"]'
          # Pin the head SHA before waiting: a new push invalidates the poll.
          PINNED_SHA="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)"
          echo "Pinned head SHA: $PINNED_SHA"
          ATTEMPTS=0
          GATE_OK=0
          while [ "$ATTEMPTS" -lt 20 ]; do
            DATA="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid,statusCheckRollup)"
            CUR_SHA="$(printf '%s' "$DATA" | jq -r .headRefOid)"
            if [ "$CUR_SHA" != "$PINNED_SHA" ]; then
              echo "::warning::Autofix PR merge aborted — head moved $PINNED_SHA -> $CUR_SHA during the wait; a fresh run will re-evaluate."
              exit 0
            fi
            # statusCheckRollup mixes CheckRuns ({name,status,conclusion}) and
            # legacy StatusContexts ({context,state}): normalize both shapes,
            # then evaluate fail-closed: empty rollup, pending, failures, or
            # missing/non-SUCCESS required checks all block.
            EVAL="$(printf '%s' "$DATA" | jq --argjson required "$REQUIRED" '
              [.statusCheckRollup[] |
                if .__typename == "StatusContext" then
                  {name: .context, done: (.state != "PENDING"), bad: (.state == "FAILURE" or .state == "ERROR"), success: (.state == "SUCCESS")}
                else
                  {done: (.status == "COMPLETED"), bad: (.conclusion as $c | $c != null and (["SUCCESS","SKIPPED","NEUTRAL"] | index($c) | not)), success: (.conclusion == "SUCCESS")} + {name: .name}
                end] as $checks |
              {
                total: ($checks | length),
                pending: ([$checks[] | select(.done | not)] | length),
                failed: ([$checks[] | select(.bad)] | length),
                missing: [$required[] as $r | select([$checks[] | select(.success and (.name | contains($r)))] | length == 0) | $r]
              }')"
            TOTAL=$(printf '%s' "$EVAL" | jq -r .total)
            PENDING=$(printf '%s' "$EVAL" | jq -r .pending)
            FAILED=$(printf '%s' "$EVAL" | jq -r .failed)
            MISSING=$(printf '%s' "$EVAL" | jq -r '.missing | join(", ")')
            if [ "$TOTAL" -eq 0 ]; then
              echo "::warning::Autofix PR merge blocked — no CI checks reported for head $PINNED_SHA (empty rollup); hourly orchestrator will retry."
              exit 0
            fi
            if [ "$FAILED" -ne 0 ]; then
              echo "::warning::Autofix PR merge blocked — PR #${PR_NUMBER} has $FAILED failing check(s); hourly orchestrator will retry."
              exit 0
            fi
            if [ -n "$MISSING" ]; then
              echo "::warning::Autofix PR merge blocked — required checks not SUCCESS on head $PINNED_SHA: $MISSING; hourly orchestrator will retry."
              exit 0
            fi
            if [ "$PENDING" -eq 0 ]; then GATE_OK=1; break; fi
            ATTEMPTS=$((ATTEMPTS + 1))
            echo "Waiting for $PENDING check(s)... (attempt $ATTEMPTS/20)"
            sleep 60
          done
          if [ "$GATE_OK" -ne 1 ]; then
            echo "::warning::Auto-merge skipped — PR #${PR_NUMBER} still has pending check(s) after ~20 min; hourly orchestrator will retry."
            exit 0
          fi
          # Final re-verification on the pinned SHA immediately before merge.
          FINAL_OK="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid,statusCheckRollup | jq --arg sha "$PINNED_SHA" --argjson required "$REQUIRED" '
            if .headRefOid != $sha then false
            else
              [.statusCheckRollup[] |
                if .__typename == "StatusContext" then
                  {name: .context, done: (.state != "PENDING"), bad: (.state == "FAILURE" or .state == "ERROR"), success: (.state == "SUCCESS")}
                else
                  {done: (.status == "COMPLETED"), bad: (.conclusion as $c | $c != null and (["SUCCESS","SKIPPED","NEUTRAL"] | index($c) | not)), success: (.conclusion == "SUCCESS")} + {name: .name}
                end] as $checks |
              ($checks | length) > 0
              and ([$checks[] | select(.done | not)] | length == 0)
              and ([$checks[] | select(.bad)] | length == 0)
              and ([$required[] as $r | select([$checks[] | select(.success and (.name | contains($r)))] | length == 0)] | length == 0)
            end')"
          if [ "$FINAL_OK" != "true" ]; then
            echo "::warning::Autofix PR merge aborted — final gate re-check failed (head moved or checks regressed); hourly orchestrator will retry."
            exit 0
          fi
          echo "All checks green on pinned head $PINNED_SHA — checking human merge approval..."
          # DISC-001: human merge approval required — advisory
          # `autofix:ready` never authorizes a merge on its own. Denial
          # defers (never merges); the step stays exit 0.
          if ! .github/scripts/autofix-merge-approval.sh "$PR_NUMBER" "$REPO" "$PINNED_SHA"; then
            echo "::warning::Autofix PR merge deferred for PR #${PR_NUMBER} — merge approval not verified; hourly orchestrator will retry."
            exit 0
          fi
          FINAL_HEAD=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)
          if [ "$FINAL_HEAD" != "$PINNED_SHA" ]; then
            echo "::warning::Autofix PR merge deferred for PR #${PR_NUMBER} — head changed after approval."
            exit 0
          fi
          echo "Merge approval verified on pinned head $PINNED_SHA — merging autofix PR #${PR_NUMBER}..."
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch --match-head-commit "$PINNED_SHA" \
            || echo "::warning::Autofix PR merge not possible (merge conflict) — hourly orchestrator will retry."

  notify-merged:
    name: Notify merged autofix PR
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'autofix:ready')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Post merge comment and update labels
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          LINKED_ISSUE="$(printf '%s' "${PR_TITLE}" | grep -oP '#\d+' | head -1 | tr -d '#')"
          if [ -n "${LINKED_ISSUE}" ]; then
            closes_line="Closes #${LINKED_ISSUE}."
          else
            closes_line=""
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "## Merged successfully
          The autofix PR was merged. ${closes_line}"
          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label autofix:ready --add-label autofix:merged || true