name: Upstream Ecosystem Monitor

on:
  schedule:
    # Weekly: Sunday 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      create_issues:
        description: Create GitHub issues from Tier-A findings (false = report only)
        type: boolean
        default: true
      force_check:
        description: FOCUS FEATURE slug — scope the research run to a single upstream target (e.g. opencode-cli)
        type: string
        default: ''
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream-monitor
  cancel-in-progress: false

jobs:
  research:
    name: Research upstream ecosystem
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      improvements_found: ${{ steps.research.outputs.improvements_found }}
      actionable_found: ${{ steps.research.outputs.actionable_found }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.8.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 (node24 line; runner floor ubuntu-24.04; engine floor Node >=24.19.0 — July 2026 HIGH CVE fixes)
        with:
          node-version: 24
          cache: pnpm

      - name: Run offline engine check (schema + fixture + gate)
        env:
          MONITOR_OUT_DIR: ${{ runner.temp }}/monitor
        run: bash .github/scripts/upstream-monitor.sh check

      - name: Install pinned OpenCode CLI
        # The pinned script hard-pins v1.18.31 and verifies the archive with
        # `sha256sum --check` against a digest committed in this repository. The
        # unpinned sibling downloads whatever `latest` resolves to with no
        # verification at all, then executes it — while a PAT was in scope.
        # No `env:` block on purpose: the install needs no token, and keeping one
        # would hand it to the freshly downloaded binary.
        run: bash .github/scripts/setup-opencode-pinned.sh

      - name: Research upstream ecosystem
        id: research
        run: bash .github/scripts/upstream-monitor.sh research
        env:
          MONITOR_OUT_DIR: ${{ runner.temp }}/monitor
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          FORCE_CHECK: ${{ inputs.force_check }}

      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24 line)
        with:
          name: monitor-research-report
          path: ${{ runner.temp }}/monitor/research-output.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload findings JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24 line)
        with:
          name: monitor-findings-json
          path: |
            ${{ runner.temp }}/monitor/findings.json
            ${{ runner.temp }}/monitor/actionable-findings.json
          retention-days: 30
          if-no-files-found: ignore

  notify-failure:
    name: Notify research failure
    needs: research
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Open or update monitor-failure issue
        run: |
          gh label create monitor-failure --force --color d93f0b --description 'Upstream monitor research failed' 2>/dev/null || true
          EXISTING="$(gh issue list --repo "${{ github.repository }}" --label monitor-failure --state open --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Run failed again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "[Monitor] Upstream ecosystem research failed" \
              --label monitor-failure \
              --body "The weekly upstream research run failed at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Investigate logs and re-run the workflow." || true
          fi

  create-issues:
    name: Create improvement issues
    needs: research
    if: needs.research.outputs.actionable_found != '0' && (github.event_name == 'schedule' || inputs.create_issues != 'false')
    # The dedup gate's verdict, as machine-readable step outputs, so the
    # notifier below can NAME the cause instead of saying "create-issues
    # failed" and leaving a 04:00 triage to the raw log. These are declared on
    # the job so the dependent job can read them even though the step itself
    # failed (a failed step's outputs are otherwise dropped by Actions).
    outputs:
      dedup_status: ${{ steps.publish.outputs.dedup_status }}
      dedup_checked: ${{ steps.publish.outputs.dedup_checked }}
      dedup_mangled: ${{ steps.publish.outputs.dedup_mangled }}
      dedup_missing_fingerprint: ${{ steps.publish.outputs.dedup_missing_fingerprint }}
      dedup_read_failures: ${{ steps.publish.outputs.dedup_read_failures }}
      dedup_saturated: ${{ steps.publish.outputs.dedup_saturated }}
      dedup_mangle_rate: ${{ steps.publish.outputs.dedup_mangle_rate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download findings JSON
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (node24 line)
        with:
          name: monitor-findings-json
          path: ${{ runner.temp }}/monitor

      - name: Install pinned OpenCode CLI
        # The pinned script hard-pins v1.18.31 and verifies the archive with
        # `sha256sum --check` against a digest committed in this repository. The
        # unpinned sibling downloads whatever `latest` resolves to with no
        # verification at all, then executes it — while a PAT was in scope.
        # No `env:` block on purpose: the install needs no token, and keeping one
        # would hand it to the freshly downloaded binary.
        run: bash .github/scripts/setup-opencode-pinned.sh

      - name: Publish improvement issues
        id: publish
        run: bash .github/scripts/upstream-monitor.sh publish
        env:
          MONITOR_OUT_DIR: ${{ runner.temp }}/monitor
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}

      - name: Upload created issues JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24 line)
        with:
          name: monitor-created-issues-json
          path: ${{ runner.temp }}/monitor/created-issues.json
          retention-days: 30
          if-no-files-found: ignore

  # A red create-issues must be SEEN. It used to leave a red badge and a summary
  # comment and file nothing: only `research` had a notify companion, so a
  # dedup-gate failure — the most likely failure this workflow has — paged
  # nobody. That is the mirror image of the check that could not fail, and it is
  # the same defect class: a failure that cannot be observed is indistinguishable
  # from a failure that did not happen.
  #
  # THIS JOB MUST NOT LOOP. Every `gh` call below is `|| true`, exactly as in
  # the research notifier: if the failure issue cannot be opened, this job
  # still succeeds, so it can never fail the workflow in a way that masks the
  # original cause or re-triggers itself. The run URL is always in the body, so
  # a silent notifier still leaves a pointer.
  notify-create-issues:
    name: Notify create-issues failure
    needs: create-issues
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEDUP_STATUS: ${{ needs.create-issues.outputs.dedup_status }}
      DEDUP_CHECKED: ${{ needs.create-issues.outputs.dedup_checked }}
      DEDUP_MANGLED: ${{ needs.create-issues.outputs.dedup_mangled }}
      DEDUP_NOFP: ${{ needs.create-issues.outputs.dedup_missing_fingerprint }}
      DEDUP_READFAIL: ${{ needs.create-issues.outputs.dedup_read_failures }}
      DEDUP_MANGLE_RATE: ${{ needs.create-issues.outputs.dedup_mangle_rate }}
    steps:
      - name: Name the cause
        id: cause
        run: |
          set -uo pipefail
          # Name the cause. The three ways this job can fail need three
          # different fixes, and "create-issues failed" tells a maintainer
          # nothing about which one they are looking at.
          if [ "${DEDUP_STATUS:-}" = "unverified" ] && [ "${DEDUP_MANGLED:-0}" != "0" ]; then
            echo "cause=**Fingerprint mangled.** The publisher agent wrote a monitor-id comment that is not a 64-hex sha256 digest, so the dedup gate refused to guess and could not verify the run. This is a content error in the issues it just created — check the body of the issue(s) listed as UNVERIFIED in the run log. Upstream cause is the publish prompt transcribing a digest by hand." >> "$GITHUB_OUTPUT"
            echo "fix=Publisher prompt, not the gate. Tighten build_publish_prompt so the digest is computed rather than transcribed. Do NOT relax the id check: that reopens the destructive false positive this gate exists to prevent." >> "$GITHUB_OUTPUT"
          elif [ "${DEDUP_STATUS:-}" = "unverified" ] && [ "${DEDUP_READFAIL:-0}" != "0" ]; then
            echo "cause=**GitHub read failure.** \`gh issue view\` failed, so the gate could not read the fingerprint it needed. This is an API/rate-limit problem, NOT a malformed issue body." >> "$GITHUB_OUTPUT"
            echo "fix=Transient. Re-run the workflow. If it persists, check GitHub API rate limits and token scope." >> "$GITHUB_OUTPUT"
          elif [ "${DEDUP_STATUS:-}" = "unverified" ]; then
            echo "cause=**Fingerprint missing.** The publisher agent created an issue with no readable monitor-id comment at all, so the gate could not verify it." >> "$GITHUB_OUTPUT"
            echo "fix=Publisher prompt: the fingerprint footer is a required section and the agent omitted it." >> "$GITHUB_OUTPUT"
          elif [ "${DEDUP_STATUS:-}" = "partial" ]; then
            echo "cause=**Backlog saturation.** The open monitor issue count reached MONITOR_LIMIT, so older duplicate holders were invisible. Nothing was closed and no duplicate count was claimed." >> "$GITHUB_OUTPUT"
            echo "fix=Triage the open monitor backlog. Closing an open monitor issue frees a slot; only raise MONITOR_LIMIT if the backlog is genuinely that large." >> "$GITHUB_OUTPUT"
          else
            echo "cause=**create-issues failed before the dedup gate reported.** The publish step exited non-zero without a dedup verdict — publish itself failed, or the manifest was unreadable." >> "$GITHUB_OUTPUT"
            echo "fix=Read the publish step in the run log; the dedup gate never got a verdict." >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## Upstream monitor — issue publication failed"
            echo
            echo "${{ steps.cause.outputs.cause }}"
            echo
            echo "- Issues created this run: \${DEDUP_CHECKED:-0} checked by the dedup gate"
            echo "- Fingerprint mangled (not 64-hex): \${DEDUP_MANGLED:-0}"
            echo "- Fingerprint missing entirely: \${DEDUP_NOFP:-0}"
            echo "- Unreadable (GitHub API): \${DEDUP_READFAIL:-0}"
            echo "- **Mangling rate: \${DEDUP_MANGLE_RATE:-n/a}% of created issues**"
            echo
            echo "**What to do:** ${{ steps.cause.outputs.fix }}"
            echo
            echo "The mangling rate matters for whether this alert stays worth having. The run is capped at 8 created issues per week; a rate under ~12% (fewer than 1 in 8) keeps this rare enough to be trusted, while 1-in-8 pages every single run and is indistinguishable from no signal. If it is climbing, tighten the publish prompt — do not relax the id check."
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$RUNNER_TEMP/cause.md"
      - name: Open or update monitor-failure issue
        run: |
          set -uo pipefail
          gh label create monitor-failure --force --color d93f0b --description 'Upstream monitor research failed' 2>/dev/null || true
          EXISTING="$(gh issue list --repo "${{ github.repository }}" --label monitor-failure --state open --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/cause.md" || true
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "[Monitor] Issue publication failed" \
              --label monitor-failure \
              --body-file "$RUNNER_TEMP/cause.md" || true
          fi
          # Explicitly succeed even if a `gh` call above misbehaved, so this
          # job can never be the thing that fails the workflow.
          exit 0

  summary:
    name: Monitor summary
    needs: [research, create-issues]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download research report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (node24 line)
        with:
          name: monitor-research-report
          path: ${{ runner.temp }}/monitor

      - name: Download findings JSON
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (node24 line)
        with:
          name: monitor-findings-json
          path: ${{ runner.temp }}/monitor

      - name: Download created issues JSON
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (node24 line)
        with:
          name: monitor-created-issues-json
          path: ${{ runner.temp }}/monitor

      - name: Post summary
        env:
          MONITOR_OUT_DIR: ${{ runner.temp }}/monitor
          # The summary runs with `if: always()`, so on a failed create-issues
          # it is the one artefact a human is guaranteed to read. Without this
          # it prints a clean-looking results table for a run that verified
          # nothing — the summary papering over the very failure the notifier
          # exists to surface.
          CREATE_ISSUES_RESULT: ${{ needs.create-issues.result }}
          CREATE_ISSUES_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/upstream-monitor.sh report