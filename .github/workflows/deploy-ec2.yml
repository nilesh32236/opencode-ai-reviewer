name: Deploy via Rsync & Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: |
          pnpm lint
          git diff --check

      - name: Verify EC2 host key
        id: host-key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_HOST_FINGERPRINT: ${{ secrets.EC2_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          known_hosts="$RUNNER_TEMP/ec2_known_hosts"
          ssh-keyscan -T 10 -t ed25519 -H "$EC2_HOST" > "$known_hosts"
          test -s "$known_hosts"
          ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | grep -Fx -- "$EC2_HOST_FINGERPRINT"
          echo "path=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Sync files to EC2 via Rsync
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          TARGET: "/home/${{ secrets.EC2_USER }}/opencode-ai-reviewer"
          EXCLUDE: "/.git/, /node_modules/, /dist/, /.env, /*.pem, private-key.pem"
          ARGS: "-rlgoDzvc -i --delete"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile=${{ steps.host-key.outputs.path }}"

      - name: Build and Restart Docker Containers
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ steps.host-key.outputs.path }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/ec2_deploy_key"
          printf '%s\n' "$EC2_SSH_KEY" > "$key"
          chmod 600 "$key"

          ssh \
            -i "$key" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            "$EC2_USER@$EC2_HOST" \
            'set -e
            cd "$HOME/opencode-ai-reviewer"
            test -f .env || { echo "ERROR: .env missing on server" >&2; exit 1; }

            # Ensure the Docker Compose v2 plugin is available. The compose file
            # uses v2-only features (env_file path/required), so a missing
            # plugin makes `docker compose` fail with "unknown shorthand flag".
            if ! docker compose version >/dev/null 2>&1; then
              echo "Installing Docker Compose v2 plugin..."
              mkdir -p "$HOME/.docker/cli-plugins"
              case "$(uname -m)" in
                aarch64|arm64) compose_arch="aarch64" ;;
                x86_64|amd64)  compose_arch="x86_64" ;;
                *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.1/docker-compose-linux-${compose_arch}" \
                -o "$HOME/.docker/cli-plugins/docker-compose"
              chmod +x "$HOME/.docker/cli-plugins/docker-compose"
              docker compose version
            fi

            # Free disk space before building: repeated `--build` runs accumulate
            # multi-GB build caches on the small EBS volume and fail with ENOSPC.
            docker builder prune -af 2>/dev/null || true
            docker image prune -af 2>/dev/null || true

            # Build and start containers in background
            docker compose -f docker/docker-compose.yml --env-file .env up -d --build

            # Confirm the new container remains running before removing old images.
            sleep 10
            if ! docker compose -f docker/docker-compose.yml --env-file .env ps --status running -q | grep -q .; then
              echo "ERROR: container failed to start" >&2
              docker compose -f docker/docker-compose.yml --env-file .env logs --tail 50
              exit 1
            fi

            # Clean up unused old Docker images to save disk space
            docker image prune -f'
