# ─── Reusable Workflow: AI PR Review ───
# Usage: Reference this workflow from your repo's .github/workflows/
#
#   jobs:
#     review:
#       uses: nilesh32236/opencode-ai-reviewer/.github/workflows/review.yml@v1
#       with:
#         model: 'opencode/deepseek-v4-flash-free'
#       secrets: inherit
#
# Required secrets:
#   - repo_token: GitHub token with pull-requests:write
# Optional secrets (for non-default models):
#   - OPENAI_API_KEY
#   - ANTHROPIC_API_KEY
#   - GEMINI_API_KEY
#   - OPENCODE_API_KEY (OpenCode gateway, e.g. opencode-go/* models)

name: AI PR Review

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (optional, auto-resolved if empty)'
        required: false
        type: string
        default: ''
      model:
        description: 'OpenCode model to use'
        required: false
        type: string
        default: 'opencode/deepseek-v4-flash-free'
      max_files_per_batch:
        description: 'Max files per sub-agent batch'
        required: false
        type: number
        default: 3
      fail_on_critical:
        description: 'Fail workflow on critical issues'
        required: false
        type: boolean
        default: false
      include_strengths:
        description: 'Include strengths in review'
        required: false
        type: boolean
        default: true
      project_context:
        description: 'Custom project context'
        required: false
        type: string
        default: ''
    outputs:
      verdict:
        description: 'Review verdict (true/false)'
        value: ${{ jobs.review.outputs.verdict }}
      critical_count:
        description: 'Number of critical issues'
        value: ${{ jobs.review.outputs.critical_count }}
      important_count:
        description: 'Number of important issues'
        value: ${{ jobs.review.outputs.important_count }}
      minor_count:
        description: 'Number of minor issues'
        value: ${{ jobs.review.outputs.minor_count }}
    secrets:
      repo_token:
        description: 'GitHub token with pull-requests:write'
        required: true
      OPENAI_API_KEY:
        description: 'OpenAI API key (required when using OpenAI models)'
        required: false
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key (required when using Anthropic models)'
        required: false
      GEMINI_API_KEY:
        description: 'Google Gemini API key (required when using Gemini models)'
        required: false
      OPENCODE_API_KEY:
        description: 'OpenCode gateway API key (required when using opencode-go/* models)'
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number || github.sha }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      verdict: ${{ steps.ai-review.outputs.verdict }}
      critical_count: ${{ steps.ai-review.outputs.critical_count }}
      important_count: ${{ steps.ai-review.outputs.important_count }}
      minor_count: ${{ steps.ai-review.outputs.minor_count }}

    steps:
      - name: Resolve Git ref
        id: resolve-ref
        env:
          GH_TOKEN: ${{ secrets.repo_token || secrets.GITHUB_TOKEN }}
        run: |
          INPUT_REF="${{ inputs.ref }}"
          PR_REF="${{ github.event.pull_request.head.ref }}"
          if [ -n "$INPUT_REF" ]; then
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          elif [ -n "$PR_REF" ]; then
            echo "ref=$PR_REF" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issue_comment" ] && [ -n "${{ github.event.issue.pull_request }}" ]; then
            PR_NUMBER="${{ github.event.issue.number }}"
            REF=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName --jq .headRefName 2>/dev/null || echo "")
            if [ -n "$REF" ]; then
              echo "ref=$REF" >> "$GITHUB_OUTPUT"
            else
              echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.resolve-ref.outputs.ref }}

      - name: Validate API key secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if echo "${{ inputs.model }}" | grep -qiE 'openai|gpt'; then
            [ -n "$OPENAI_API_KEY" ] || echo "::warning::OPENAI_API_KEY secret is not configured — OpenAI models will fail to authenticate"
          fi
          if echo "${{ inputs.model }}" | grep -qiE 'anthropic|claude'; then
            [ -n "$ANTHROPIC_API_KEY" ] || echo "::warning::ANTHROPIC_API_KEY secret is not configured — Anthropic models will fail to authenticate"
          fi
          if echo "${{ inputs.model }}" | grep -qiE 'gemini'; then
            [ -n "$GEMINI_API_KEY" ] || echo "::warning::GEMINI_API_KEY secret is not configured — Gemini models will fail to authenticate"
          fi

      - name: AI Code Review
        id: ai-review
        uses: nilesh32236/opencode-ai-reviewer@v1
        with:
          mode: review
          model: ${{ inputs.model }}
          max_files_per_batch: ${{ inputs.max_files_per_batch }}
          fail_on_critical: ${{ inputs.fail_on_critical }}
          include_strengths: ${{ inputs.include_strengths }}
          project_context: ${{ inputs.project_context }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          opencode_api_key: ${{ secrets.OPENCODE_API_KEY }}
          github_token: ${{ secrets.repo_token }}