name: Workflow Health

# Watchdog for the repo's own automation: detects failed workflow runs,
# classifies the cause, and files (or refreshes) exactly one GitHub issue per
# failure fingerprint. Flaky infra failures are retried automatically
# (capped); recovered workflows close their health issue (self-heal closure).
#
# ANTI-DUPLICATION (hard requirement): simultaneous failures must never open
# twin issues. Three layers enforce this:
#   1. This workflow runs under ONE concurrency group
#      (`workflow-health`, cancel-in-progress: false) — overlapping triggers
#      queue and execute serially, never in parallel.
#   2. Each failure maps to a stable fingerprint
#      (workflow|job|step|normalized-signature); reruns hash identically.
#   3. The script re-checks for an open fingerprinted issue immediately
#      before creating, and repeat failures only append a throttled
#      (6h) "still failing" comment.
#
# The watchdog never merges, never force-pushes, never touches human
# branches, and never adds `autofix-trigger` by itself (that label would feed
# the fix loop and spend model budget — a human opts in deliberately).
# Reads runs (actions:read), reruns flakes (actions:write), files issues
# (issues:write). Log tails are secret-scrubbed before they reach issues.

on:
  workflow_run:
    workflows:
      - CI
      - CodeQL
      - AI Multi-Agent Review
      - Daily Scheduled Audit
      - Upstream Ecosystem Monitor
      - Hourly Autonomous Orchestrator
    types: [completed]
  schedule:
    # Backstop sweep every 30 minutes (covers missed events and long jobs).
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the plan without opening issues or rerunning (report only)'
        type: boolean
        default: true
      since_hours:
        description: 'Sweep window in hours (schedule/dispatch path only)'
        type: string
        default: '2'
        required: false

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: workflow-health
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Sweep failed runs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          # workflow_run path analyzes exactly the completed run; the
          # schedule/dispatch path sweeps the recent window instead.
          TARGET_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          SINCE_HOURS: ${{ inputs.since_hours || '2' }}
        run: bash .github/scripts/workflow-health.sh
