name: Hourly Autonomous Orchestrator

# SEC-001: discovery, model/agent work, verification, and GitHub publication
# run on separate runners. Artifacts are treated as untrusted input.

on:
  schedule:
    - cron: '0 * * * *'

permissions: {}

concurrency:
  group: hourly-orchestrator
  cancel-in-progress: false

jobs:
  guard:
    name: Require trusted main dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject non-main workflow dispatch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo 'SEC-001: hourly orchestration is trusted only from refs/heads/main' >&2
          exit 1
      - name: Confirm trusted ref
        run: test "${{ github.ref }}" = refs/heads/main

  discover:
    name: Discover hourly work (GitHub read token only)
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    outputs:
      base_sha: ${{ steps.tasks.outputs.base_sha }}
      has_work: ${{ steps.tasks.outputs.has_work }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: main
          persist-credentials: false
      - name: Build validated task manifest
        id: tasks
        shell: /bin/sh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          BASH_ENV: /dev/null
        run: |
          set -eu
          BASE_SHA="$(git rev-parse HEAD)"
          PRS="$(gh pr list --repo "${{ github.repository }}" --state open --json number,title,headRefName,headRefOid,baseRefName,mergeable,labels,isCrossRepository | jq '[.[] | select((.labels | map(.name) | contains(["autofix:skipped"]) | not) and (.labels | map(.name) | contains(["autofix:needs-manual-review"]) | not)) | {number,title,head_ref:.headRefName,head_sha:.headRefOid,base_ref:.baseRefName,mergeable,labels:(.labels|map(.name)),is_cross_repository:.isCrossRepository}]')"
          if [ "$(printf '%s' "$PRS" | jq 'length')" -gt 0 ]; then
            jq -n --arg run_id "${{ github.run_id }}" --arg base_sha "$BASE_SHA" --argjson prs "$PRS" '{run_id:$run_id,base_sha:$base_sha,mode:"prs",prs:$prs,issue:null}' > "$RUNNER_TEMP/hourly-tasks.json"
            HAS_WORK=true
          else
            ISSUE="$(gh issue list --repo "${{ github.repository }}" --state open --json number,title,labels,body,comments | jq '[.[] | select((.labels | map(.name) | contains(["autofix:skipped"]) | not) and (.labels | map(.name) | contains(["autofix:completed"]) | not))] | sort_by(.number) | .[0] // null')"
            if [ "$(printf '%s' "$ISSUE" | jq 'type')" = null ]; then
              jq -n --arg run_id "${{ github.run_id }}" --arg base_sha "$BASE_SHA" '{run_id:$run_id,base_sha:$base_sha,mode:"none",prs:[],issue:null}' > "$RUNNER_TEMP/hourly-tasks.json"
              HAS_WORK=false
            else
              jq -n --arg run_id "${{ github.run_id }}" --arg base_sha "$BASE_SHA" --argjson issue "$ISSUE" '{run_id:$run_id,base_sha:$base_sha,mode:"issues",prs:[],issue:($issue + {has_questions: ((($issue.labels|map(.name)|index("analysis:needs-input")) != null) or (($issue.comments // [])|map(.body // "")|join("\\n")|contains("<!-- issue-analysis-questions -->")))})}' > "$RUNNER_TEMP/hourly-tasks.json"
              HAS_WORK=true
            fi
          fi
          bash .github/scripts/sec001-artifact.sh wrap --output "$RUNNER_TEMP/sec001-hourly-task" --input "$RUNNER_TEMP/hourly-tasks.json" --name tasks.json --run-id "${{ github.run_id }}" --base-sha "$BASE_SHA" --phase discover
          printf 'base_sha=%s\nhas_work=%s\n' "$BASE_SHA" "$HAS_WORK" >> "$GITHUB_OUTPUT"
      - name: Upload task manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sec001-hourly-task-${{ github.run_id }}
          path: ${{ runner.temp }}/sec001-hourly-task
          if-no-files-found: error
          retention-days: 7

  agent:
    name: Hourly agent (provider credential only)
    needs: [guard, discover]
    if: ${{ needs.discover.result == 'success' && needs.discover.outputs.has_work == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: main
          persist-credentials: false
      - name: Snapshot trusted SEC-001 helpers before agent execution
        run: |
          set -eu
          sudo rm -rf /opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}
          sudo install -d -o root -g root -m 0555 /opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}
          sudo install -o root -g root -m 0444 .github/scripts/sec001-artifact.sh /opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/sec001-artifact.sh
          sudo install -o root -g root -m 0444 .github/scripts/run-sec001-opencode.sh /opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/run-sec001-opencode.sh
          sudo install -o root -g root -m 0444 .github/scripts/sec001-hourly-agent.sh /opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/sec001-hourly-agent.sh
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.8.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned OpenCode without GitHub credentials
        run: bash .github/scripts/setup-opencode-pinned.sh
      - name: Download and validate task manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sec001-hourly-task-${{ github.run_id }}
          path: ${{ runner.temp }}/sec001-hourly-task
      - name: Materialize task manifest
        env:
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          BASH_ENV: /dev/null
          PATH: /usr/local/bin:/usr/bin:/bin
        run: |
          bash .github/scripts/sec001-artifact.sh validate-wrap --artifact "$RUNNER_TEMP/sec001-hourly-task" --expected-run-id "${{ github.run_id }}" --expected-base-sha "$BASE_SHA" --expected-phase discover
          cp "$RUNNER_TEMP/sec001-hourly-task/tasks.json" "$RUNNER_TEMP/hourly-tasks.json"
      - name: Run hourly agent (OpenCode provider)
        if: ${{ startsWith(vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free', 'opencode/') }}
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          BASH_ENV: /dev/null
        run: bash "/opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/sec001-hourly-agent.sh" --tasks "$RUNNER_TEMP/hourly-tasks.json" --output "$RUNNER_TEMP/sec001-hourly-agent" --repo "${{ github.repository }}" --base-sha "${{ needs.discover.outputs.base_sha }}" --model "${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}" --opencode-wrapper "/opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/run-sec001-opencode.sh" --artifact-helper "/opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/sec001-artifact.sh"
      - name: Run hourly agent (OpenAI provider)
        if: ${{ startsWith(vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free', 'openai/') }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          BASH_ENV: /dev/null
        run: bash "/opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/sec001-hourly-agent.sh" --tasks "$RUNNER_TEMP/hourly-tasks.json" --output "$RUNNER_TEMP/sec001-hourly-agent" --repo "${{ github.repository }}" --base-sha "${{ needs.discover.outputs.base_sha }}" --model "${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}" --opencode-wrapper "/opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/run-sec001-opencode.sh" --artifact-helper "/opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/sec001-artifact.sh"
      - name: Run hourly agent (Anthropic provider)
        if: ${{ startsWith(vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free', 'anthropic/') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          BASH_ENV: /dev/null
        run: bash "/opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/sec001-hourly-agent.sh" --tasks "$RUNNER_TEMP/hourly-tasks.json" --output "$RUNNER_TEMP/sec001-hourly-agent" --repo "${{ github.repository }}" --base-sha "${{ needs.discover.outputs.base_sha }}" --model "${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}" --opencode-wrapper "/opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/run-sec001-opencode.sh" --artifact-helper "/opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/sec001-artifact.sh"
      - name: Run hourly agent (Google provider)
        if: ${{ startsWith(vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free', 'google/') || startsWith(vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free', 'gemini/') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          BASH_ENV: /dev/null
        run: bash "/opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/sec001-hourly-agent.sh" --tasks "$RUNNER_TEMP/hourly-tasks.json" --output "$RUNNER_TEMP/sec001-hourly-agent" --repo "${{ github.repository }}" --base-sha "${{ needs.discover.outputs.base_sha }}" --model "${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}" --opencode-wrapper "/opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/run-sec001-opencode.sh" --artifact-helper "/opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/sec001-artifact.sh"
      - name: Reject unsupported hourly provider
        if: ${{ !(startsWith(vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free', 'opencode/') || startsWith(vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free', 'openai/') || startsWith(vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free', 'anthropic/') || startsWith(vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free', 'google/') || startsWith(vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free', 'gemini/')) }}
        run: exit 1
      - name: Add metadata to agent results
        env:
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          BASH_ENV: /dev/null
          PATH: /usr/local/bin:/usr/bin:/bin
        run: |
          bash "/opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/sec001-artifact.sh" scan-tree --input "$RUNNER_TEMP/sec001-hourly-agent"
          bash "/opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/sec001-artifact.sh" wrap --output "$RUNNER_TEMP/sec001-hourly-agent/results-meta" --input "$RUNNER_TEMP/sec001-hourly-agent/results.json" --name results.json --run-id "${{ github.run_id }}" --base-sha "$BASE_SHA" --phase agent
      - name: Upload agent results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sec001-hourly-agent-${{ github.run_id }}
          path: ${{ runner.temp }}/sec001-hourly-agent
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify hourly patches (no secrets)
    needs: [guard, discover, agent]
    if: ${{ needs.agent.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      all_verified: ${{ steps.status.outputs.all_verified }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: main
          persist-credentials: false
      - name: Snapshot trusted verification helpers before patch execution
        run: |
          set -eu
          sudo rm -rf /opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}
          sudo install -d -o root -g root -m 0555 /opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}
          sudo install -o root -g root -m 0444 .github/scripts/sec001-artifact.sh /opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/sec001-artifact.sh
          sudo install -o root -g root -m 0444 .github/scripts/sec001-hourly-verify.sh /opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/sec001-hourly-verify.sh
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.8.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Download agent results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sec001-hourly-agent-${{ github.run_id }}
          path: ${{ runner.temp }}/sec001-hourly-agent
      - name: Validate result metadata and run isolated gates
        id: status
        env:
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          BASH_ENV: /dev/null
          PATH: /usr/local/bin:/usr/bin:/bin
        run: |
          set -euo pipefail
          bash "/opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/sec001-artifact.sh" validate-wrap --artifact "$RUNNER_TEMP/sec001-hourly-agent/results-meta" --expected-run-id "${{ github.run_id }}" --expected-base-sha "$BASE_SHA" --expected-phase agent
          bash "/opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/sec001-hourly-verify.sh" --input "$RUNNER_TEMP/sec001-hourly-agent" --output "$RUNNER_TEMP/sec001-hourly-raw" --base-sha "$BASE_SHA" --run-id "${{ github.run_id }}" --remote "https://github.com/${{ github.repository }}.git" --artifact-helper "/opt/sec001-trusted-${{ github.run_id }}-${{ github.run_attempt }}/sec001-artifact.sh"
          cat "$RUNNER_TEMP/sec001-hourly-raw/result.env" | grep '^all_verified=' | cut -d= -f2 | tr -d '\n' > "$GITHUB_OUTPUT"
      # Raw status is diagnostic only. Only a successful supervisor job can
      # reach finalize, and finalize binds it to task/result/head data.
      - name: Upload raw verification result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sec001-hourly-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/sec001-hourly-raw
          if-no-files-found: error
          retention-days: 7

  finalize:
    name: Finalize hourly status (fresh no-secret job)
    needs: [guard, discover, agent, verify]
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      all_verified: ${{ steps.finalize.outputs.all_verified }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: main
          persist-credentials: false
      - name: Download task manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sec001-hourly-task-${{ github.run_id }}
          path: ${{ runner.temp }}/sec001-hourly-task
      - name: Download agent results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sec001-hourly-agent-${{ github.run_id }}
          path: ${{ runner.temp }}/sec001-hourly-agent
      - name: Download raw verification result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sec001-hourly-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/sec001-hourly-raw
      - name: Bind and finalize verification status
        id: finalize
        env:
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          BASH_ENV: /dev/null
          PATH: /usr/local/bin:/usr/bin:/bin
        run: |
          set -euo pipefail
          bash .github/scripts/sec001-artifact.sh validate-wrap --artifact "$RUNNER_TEMP/sec001-hourly-task" --expected-run-id "${{ github.run_id }}" --expected-base-sha "$BASE_SHA" --expected-phase discover
          bash .github/scripts/sec001-artifact.sh validate-wrap --artifact "$RUNNER_TEMP/sec001-hourly-agent/results-meta" --expected-run-id "${{ github.run_id }}" --expected-base-sha "$BASE_SHA" --expected-phase agent
          bash .github/scripts/sec001-finalize-status.sh --raw "$RUNNER_TEMP/sec001-hourly-raw/status.json" --log "$RUNNER_TEMP/sec001-hourly-raw/verification.log" --output "$RUNNER_TEMP/sec001-hourly-status" --run-id "${{ github.run_id }}" --base-sha "$BASE_SHA" --phase verify --tasks "$RUNNER_TEMP/sec001-hourly-task/tasks.json" --results "$RUNNER_TEMP/sec001-hourly-agent/results.json" --job-result success --helper .github/scripts/sec001-artifact.sh
          ALL=$(jq -r '[.verifications[] | select(.verified == false)] | length == 0' "$RUNNER_TEMP/sec001-hourly-status/status.json")
          printf 'all_verified=%s\n' "$ALL" >> "$GITHUB_OUTPUT"
      - name: Upload canonical verification status
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sec001-hourly-status-${{ github.run_id }}
          path: ${{ runner.temp }}/sec001-hourly-status
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish hourly results (GitHub token only)
    needs: [guard, discover, agent, verify, finalize]
    if: ${{ needs.finalize.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT || github.token }}
          persist-credentials: false
      - name: Download task manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sec001-hourly-task-${{ github.run_id }}
          path: ${{ runner.temp }}/sec001-hourly-task
      - name: Download agent results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sec001-hourly-agent-${{ github.run_id }}
          path: ${{ runner.temp }}/sec001-hourly-agent
      - name: Download verification status
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sec001-hourly-status-${{ github.run_id }}
          path: ${{ runner.temp }}/sec001-hourly-status
      - name: Validate all cross-job metadata
        env:
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          BASH_ENV: /dev/null
          PATH: /usr/local/bin:/usr/bin:/bin
        run: |
          bash .github/scripts/sec001-artifact.sh validate-wrap --artifact "$RUNNER_TEMP/sec001-hourly-task" --expected-run-id "${{ github.run_id }}" --expected-base-sha "$BASE_SHA" --expected-phase discover
          bash .github/scripts/sec001-artifact.sh validate-wrap --artifact "$RUNNER_TEMP/sec001-hourly-agent/results-meta" --expected-run-id "${{ github.run_id }}" --expected-base-sha "$BASE_SHA" --expected-phase agent
          bash .github/scripts/sec001-artifact.sh validate-status --artifact "$RUNNER_TEMP/sec001-hourly-status/status-artifact" --expected-run-id "${{ github.run_id }}" --expected-base-sha "$BASE_SHA" --expected-phase verify
      - name: Publish labels, comments, pushes, and gated merges
        shell: /bin/sh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          BASH_ENV: /dev/null
          GIT_NO_REPLACE_OBJECTS: '1'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -eu
          bash .github/scripts/sec001-artifact.sh scan-tree --input "$RUNNER_TEMP/sec001-hourly-agent"
          bash .github/scripts/sec001-hourly-publish.sh --tasks "$RUNNER_TEMP/sec001-hourly-task/tasks.json" --results "$RUNNER_TEMP/sec001-hourly-agent/results.json" --status "$RUNNER_TEMP/sec001-hourly-status/status-artifact/status.json" --repo "${{ github.repository }}" --remote "https://github.com/${{ github.repository }}.git" --merge-gate "$GITHUB_WORKSPACE/.github/scripts/autofix-merge-gate.sh" --approval "$GITHUB_WORKSPACE/.github/scripts/autofix-merge-approval.sh" --artifact-helper "$GITHUB_WORKSPACE/.github/scripts/sec001-artifact.sh" --publish-helper "$GITHUB_WORKSPACE/.github/scripts/sec001-trusted-publish.sh"
          bash .github/scripts/sec001-artifact.sh wrap --output "$RUNNER_TEMP/sec001-issue-ready" --input "$GITHUB_WORKSPACE/issue-ready.json" --name issue-ready.json --run-id "${{ github.run_id }}" --base-sha "${{ needs.discover.outputs.base_sha }}" --phase issue-ready
      - name: Upload trusted issue-fix handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sec001-issue-ready-${{ github.run_id }}
          path: ${{ runner.temp }}/sec001-issue-ready
          if-no-files-found: error
          retention-days: 7

  trusted-fix:
    name: Trusted issue handoff (GitHub token only)
    needs: [guard, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout immutable main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: main
          token: ${{ secrets.GH_PAT || github.token }}
          persist-credentials: false
      - name: Download issue handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sec001-issue-ready-${{ github.run_id }}
          path: ${{ runner.temp }}/sec001-issue-ready
      - name: Validate trusted source and handoff
        id: issue
        shell: /bin/sh
        run: |
          set -eu
          BASE_SHA="$(jq -r '.base_sha' "$RUNNER_TEMP/sec001-issue-ready/metadata.json")"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          GIT_NO_REPLACE_OBJECTS=1 git diff --exit-code
          bash .github/scripts/sec001-artifact.sh validate-wrap --artifact "$RUNNER_TEMP/sec001-issue-ready" --expected-run-id "${{ github.run_id }}" --expected-base-sha "$BASE_SHA" --expected-phase issue-ready
          COUNT=$(jq 'length' "$RUNNER_TEMP/sec001-issue-ready/issue-ready.json")
          printf 'count=%s\n' "$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then printf 'issue_number=%s\n' "$(jq -r '.[0].number' "$RUNNER_TEMP/sec001-issue-ready/issue-ready.json")" >> "$GITHUB_OUTPUT"; fi
      - name: Request manual trusted fix action
        if: ${{ steps.issue.outputs.count == '1' }}
        shell: /bin/sh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          BASH_ENV: /dev/null
        run: |
          set -eu
          gh issue edit "${{ steps.issue.outputs.issue_number }}" --repo "${{ github.repository }}" --add-label autofix:needs-manual-review >/dev/null 2>&1 || true
          gh issue comment "${{ steps.issue.outputs.issue_number }}" --repo "${{ github.repository }}" --body 'SEC-001 safely isolated the provider agent from GitHub credentials. The existing `/fix` action contract remains available, but automatic inline execution is paused; a maintainer must invoke `/fix` after reviewing this handoff.' >/dev/null
