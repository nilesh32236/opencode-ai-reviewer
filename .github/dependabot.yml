# Keep pinned GitHub Actions fresh: Dependabot proposes SHA bumps weekly.
# Pins in .github/workflows/*.yml use full commit SHAs with `# tag` comments;
# accept a Dependabot PR only after CI is green on its head.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # codeql-action init/autobuild/analyze must share one version or the
      # Analyze step fails with "Loaded a configuration file for version X,
      # but running version Y". Keep them in a single PR.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
    commit-message:
      prefix: "chore(deps)"
