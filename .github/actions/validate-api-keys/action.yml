# ─── Composite Action: Validate API key secrets ───
# Emits soft warnings (::warning::) when the selected model is served by
# OpenAI, Anthropic, or Gemini but the corresponding secret is not configured.
# Never fails the job — the model may fall back to a key-less provider.
#
# The API key values are read from the environment (OPENAI_API_KEY,
# ANTHROPIC_API_KEY, GEMINI_API_KEY) rather than from inputs, so callers keep
# them out of this action's input context by declaring them at the job level
# via env. Job/workflow-level env propagates into composite action steps.
#
# Provider detection is heuristic (model slug matching) and only covers the
# OpenAI, Anthropic, and Gemini providers that the action can authenticate.
# Other providers (e.g. Mistral) are not validated and never warn here.

name: 'Validate API key secrets'
description: 'Warn when the selected model needs an API key secret that is not configured'

inputs:
  model:
    description: 'OpenCode model identifier (e.g. opencode/deepseek-v4-flash-free)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Warn about missing API key secrets
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
      run: |
        if echo "$MODEL" | grep -qiE 'openai|gpt'; then
          [ -n "$OPENAI_API_KEY" ] || echo "::warning::OPENAI_API_KEY secret is not configured — OpenAI models will fail to authenticate"
        fi
        if echo "$MODEL" | grep -qiE 'anthropic|claude'; then
          [ -n "$ANTHROPIC_API_KEY" ] || echo "::warning::ANTHROPIC_API_KEY secret is not configured — Anthropic models will fail to authenticate"
        fi
        if echo "$MODEL" | grep -qiE 'gemini|google/|google-|google\.'; then
          [ -n "$GEMINI_API_KEY" ] || echo "::warning::GEMINI_API_KEY secret is not configured — Gemini models will fail to authenticate"
        fi
