# OpenCode AI Reviewer Config (Dogfooding Configuration)
# For syntax details, see lib/src/config.ts

project:
  name: "OpenCode AI Reviewer"
  description: "An agentic AI assistant for code review, auto-fixing, and codebase audits (Actions & Probot App)."
  conventions:
    - "Use strict TypeScript (.ts) for all workspace packages."
    - "Keep library logic in 'lib' decoupled from 'action' and 'app' wrappers."
    - "Avoid using 'any' - favor strong type definitions and interfaces."
    - "Document public functions and configurations using JSDoc style."
  commandReference:
    "pnpm build": "Compile all packages in the workspace recursively"
    "pnpm test": "Run Jest/Vitest unit testing suites"
    "pnpm lint": "Run Biome code styling verifications"
    "pnpm typecheck": "Run strict TypeScript compiler typechecks"

review:
  enableReachability: true
  # includePreExisting: true   # full-audit mode: review pre-existing (non-PR) code at full priority
  # failOnSeverity: off   # fail the action/check run when findings at or above this severity exist: off | critical | important | minor (default: off — opt-in)
  sensitivity:
    minSeverity: warning
    confidenceThreshold: low
    maxFindingsPerCategory: 10
    maxTotalFindings: 50
  customRules:
    - "Verify error boundary handling in asynchronous functions and network requests."
    - "Check that config loaders fall back gracefully to default values."
    - "Review command execution paths for input validation and shell escapes."

fix:
  maxIterations: 3
  runChecks:
    - "pnpm build"
    - "pnpm typecheck"
    - "pnpm lint"
  checkAllowlist:
    - pnpm
    - node

audit:
  promptsDir: "prompts/audit-categories"
  categories:
    - "code-quality-conventions"
    - "security-privacy"
    - "error-handling-resilience"
    - "performance-efficiency"
    - "dockerfile-security"
    - "terraform-security"
    - "kubernetes-security"
  targetDirs:
    - "lib/src"
    - "action/src"
    - "app/src"
  createIssues: true
  autoFix: false

learning:
  enabled: true
  feedbackSignals:
    - "dismissed"
    - "reaction"
    - "disputed_comment"
  metaReview:
    enabled: true
    interval: 5
    minFindingsForReview: 3
  patternDiscovery:
    enabled: true
    minFrequency: 3
    windowSize: 100

# Optional webhook notifications for review summaries (Slack / Microsoft Teams).
# Fully opt-in: notifications are only sent when `enabled: true` and a review
# contains at least one finding at or above `minSeverity` (critical | important | minor).
# SECURITY: webhook URLs are bearer credentials. Prefer injecting them via the
# SLACK_WEBHOOK_URL / TEAMS_WEBHOOK_URL env secrets (Action workflow env or App
# server env) — those take precedence over any value placed here, and this file
# is PR-editable, so values committed here are visible to every fork/clone.
# notifications:
#   enabled: true
#   minSeverity: critical   # only notify when critical findings exist (default: critical)
#   slack:
#     # webhookUrl: https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXX
#     channel: "#code-reviews"
#   teams:
#     # webhookUrl: https://outlook.office.com/webhook/XXXX-XXXX-XXXX-XXXX
