# OpenCode AI Reviewer Config (Dogfooding Configuration)
# For syntax details, see lib/src/config.ts

project:
  name: "OpenCode AI Reviewer"
  description: "An agentic AI assistant for code review, auto-fixing, and codebase audits (Actions & Probot App)."
  conventions:
    - "Use strict TypeScript (.ts) for all workspace packages."
    - "Keep library logic in 'lib' decoupled from 'action' and 'app' wrappers."
    - "Avoid using 'any' - favor strong type definitions and interfaces."
    - "Document public functions and configurations using JSDoc style."
  commandReference:
    "pnpm build": "Compile all packages in the workspace recursively"
    "pnpm test": "Run Jest/Vitest unit testing suites"
    "pnpm lint": "Run Biome code styling verifications"
    "pnpm typecheck": "Run strict TypeScript compiler typechecks"

review:
  enableReachability: true
  # includePreExisting: true   # full-audit mode: review pre-existing (non-PR) code at full priority
  # failOnSeverity: off   # fail the action/check run when findings at or above this severity exist: off | critical | important | minor (default: off — opt-in)
  sensitivity:
    minSeverity: warning
    confidenceThreshold: low
    maxFindingsPerCategory: 10
    maxTotalFindings: 50
  customRules:
    - "Verify error boundary handling in asynchronous functions and network requests."
    - "Check that config loaders fall back gracefully to default values."
    - "Review command execution paths for input validation and shell escapes."

fix:
  maxIterations: 3
  runChecks:
    - "pnpm build"
    - "pnpm typecheck"
    - "pnpm lint"
  checkAllowlist:
    - pnpm
    - node

audit:
  promptsDir: "prompts/audit-categories"
  categories:
    - "code-quality-conventions"
    - "security-privacy"
    - "error-handling-resilience"
    - "performance-efficiency"
    - "dockerfile-security"
    - "terraform-security"
    - "kubernetes-security"
  targetDirs:
    - "lib/src"
    - "action/src"
    - "app/src"
  createIssues: true
  autoFix: false

learning:
  enabled: true
  feedbackSignals:
    - "dismissed"
    - "reaction"
    - "disputed_comment"
  metaReview:
    enabled: true
    interval: 5
    minFindingsForReview: 3
  patternDiscovery:
    enabled: true
    minFrequency: 3
    windowSize: 100

# Deterministic hardcoded secret / credential scanning. Runs on every review and
# audit pass and reports findings as blocking critical inline comments.
# `failOnSeverity: critical` (or `secrets.failCI: true`, or the `secrets_fail_ci`
# Action input) turns it into a CI gate.
secrets:
  enabled: true
  entropyThreshold: 4.5   # Shannon entropy floor for generic high-entropy strings
  minLength: 32           # minimum token length for high-entropy detection
  failCI: false           # dedicated action-failing gate (findings are critical either way)
  allowlist:
    # - "1234567890abcdef"        # literal substring match against the raw token or its redacted form
    # - "/example-token-[a-z]+/"  # /regex/ entries are compiled as regular expressions
  excludePatterns:
    - "**/*.md"
    - "**/test/fixtures/**"
    # Committed GitHub Action build output (bundled) trips the generic
    # high-entropy detector; the sources live under action/src.
    - "action/lib/**"

# Optional webhook notifications for review summaries (Slack / Microsoft Teams).
# Fully opt-in: notifications are only sent when `enabled: true` and a review
# contains at least one finding at or above `minSeverity` (critical | important | minor).
# SECURITY: webhook URLs are bearer credentials. Prefer injecting them via the
# SLACK_WEBHOOK_URL / TEAMS_WEBHOOK_URL env secrets (Action workflow env or App
# server env) — those take precedence over any value placed here, and this file
# is PR-editable, so values committed here are visible to every fork/clone.
# notifications:
#   enabled: true
#   minSeverity: critical   # only notify when critical findings exist (default: critical)
#   slack:
#     # webhookUrl: https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXX
#     channel: "#code-reviews"
#   teams:
#     # webhookUrl: https://outlook.office.com/webhook/XXXX-XXXX-XXXX-XXXX

# Optional multi-agent review architecture with specialized agents
# (security, performance, code quality, logic) + a synthesis agent that
# deduplicates and prioritizes their findings. Opt-in (default: disabled) so the
# legacy single-agent review path stays unchanged. When enabled, each specialized
# agent runs independently with its own focused prompt; findings are consolidated
# by the synthesis agent into one final review.
#
# Agents run concurrently (each namespaced under .opencode/agent-<category>/), and
# the budget-mode banner (review.budget.summaryThreshold / review.budget.splitThreshold)
# is applied to each agent prompt so large-PR cost adaptation matches the legacy path.
# multiAgent:
#   enabled: true
#   agents:
#     security:
#       enabled: true
#       # model: openai/gpt-4o-mini   # optional per-agent model override
#     performance:
#       enabled: true
#     quality:
#       enabled: true
#     logic:
#       enabled: true
#   synthesis:
#     enabled: true
#     # model: ""   # optional synthesis model override (defaults to synthesisModel/reviewModel)
