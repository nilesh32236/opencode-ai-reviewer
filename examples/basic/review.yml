# Basic Example — Single Project
#
# Copy this file to your repo: .github/workflows/ai-review.yml
#
# This project ships as a composite action only — it has no reusable
# workflows, so there is nothing to call with `uses: .../.github/workflows/...`.
# Pin a released version tag; the floating `v1` tag is currently stale.

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip bot PRs, trigger on /review comment
    if: |
      github.actor != 'github-actions[bot]' &&
      (
        github.event_name == 'pull_request' ||
        contains(github.event.comment.body || '', '/review')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: nilesh32236/opencode-ai-reviewer@v1.22.1
        id: ai-review
        with:
          mode: review
          model: 'opencode/muse-spark-1.3-contributor-free'
          # Uncomment to use OpenAI instead (API keys are passed via GitHub Secrets, never as inputs):
          # openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional: Block merge on critical issues
      - name: Check for critical issues
        if: steps.ai-review.outputs.verdict != 'true'
        run: |
          echo "::warning::AI review found issues. See the review comment on the PR."