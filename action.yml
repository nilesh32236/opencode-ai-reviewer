name: 'OpenCode AI Reviewer'
description: 'AI-powered PR review, auto-fix, and codebase audit using OpenCode'
author: 'nilesh32236'
branding:
  icon: 'code'
  color: 'blue'

inputs:
  mode:
    description: 'Action mode: review, fix, audit, post, analyze, or self-heal'
    required: true
    default: 'review'

  github_token:
    description: 'GitHub token for API access'
    required: true

  model:
    description: 'Model to use (shorthand — sets review_model, fix_model, and audit_model, and serves as global fallback for all per-stage model inputs)'
    required: false

  openai_api_key:
    description: 'OpenAI API key'
    required: false

  anthropic_api_key:
    description: 'Anthropic API key'
    required: false

  gemini_api_key:
    description: 'Google Gemini API key'
    required: false

  review_model:
    description: 'Model to use for PR review'
    required: false
    default: 'opencode/deepseek-v4-flash-free'

  fix_model:
    description: 'Model to use for auto-fix'
    required: false
    default: 'opencode/deepseek-v4-flash-free'

  audit_model:
    description: 'Model to use for codebase audit'
    required: false

  synthesis_model:
    description: 'Model to use for synthesizing batch review results'
    required: false

  verification_model:
    description: 'Model to use for meta-verification (false-positive filtering)'
    required: false

  enable_meta_verification:
    description: 'Enable the meta-verification pass that drops false-positive findings (also settable via review.enableMetaVerification in the config file)'
    required: false
    default: 'false'

  include_pre_existing:
    description: 'Review pre-existing (non-PR) code at full audit priority. When false (default), git blame annotations are injected so the reviewer deprioritizes issues on lines that predate the PR (also settable via review.includePreExisting in the config file)'
    required: false
    default: 'false'

  meta_review_model:
    description: 'Model to use for meta-review quality evaluation'
    required: false

  explanation_model:
    description: 'Model to use for PR explanation'
    required: false

  conversation_model:
    description: 'Model to use for interactive conversation'
    required: false

  analysis_model:
    description: 'Model to use for issue analysis'
    required: false

  review_prompt_file:
    description: 'Path to a custom review prompt file'
    required: false

  review_prompt_extra:
    description: 'Extra context to append to the review prompt'
    required: false

  enable_fix:
    description: 'Enable auto-fix mode'
    required: false
    default: 'true'

  max_fix_iterations:
    description: 'Maximum number of review-fix iterations'
    required: false
    default: '3'

  timeout_minutes:
    description: 'Maximum execution timeout in minutes'
    required: false
    default: '20'

  enable_audit:
    description: 'Enable codebase audit mode'
    required: false
    default: 'false'

  audit_target_dir:
    description: 'Target directory for audit'
    required: false

  max_files_per_batch:
    description: 'Maximum files per sub-agent batch'
    required: false
    default: '3'

  max_lines_per_file:
    description: 'Maximum lines per file to include in context'
    required: false
    default: '500'

  project_context:
    description: 'Project description for the review prompt'
    required: false

  enable_mcp:
    description: 'Enable MCP servers for context enrichment. SECURITY: any enabled MCP server receives GITHUB_TOKEN as an environment variable and is fetched from npm at runtime — only configure trusted servers via the mcp-servers input.'
    required: false
    default: 'false'

  mcp-servers:
    description: 'JSON array of trusted MCP server configs used when enable_mcp=true (empty by default). Each entry supports: name (string), type ("local" | "remote"), command (array of strings, local servers), url (string, remote servers), environment (object of env vars/headers), timeoutMs (number), and allowedTools (array of tool name patterns). Validated against the MCPServerConfig schema; invalid JSON or entries fall back to the built-in default servers. SECURITY: enabled servers receive GITHUB_TOKEN and are fetched from npm at runtime — only configure trusted servers.'
    required: false
    default: '[]'

  include_strengths:
    description: 'Include positive feedback in review output'
    required: false
    default: 'true'

  review_comment_summary:
    description: 'Include a summary comment on the PR'
    required: false
    default: 'true'

  run_checks_after_fix:
    description: 'Commands to run after fix (e.g. npm run lint)'
    required: false

  audit_prompt_file:
    description: 'Path to a custom audit prompt file'
    required: false

  audit_create_issues:
    description: 'Create GitHub issues for audit findings'
    required: false
    default: 'true'

  audit_auto_fix:
    description: 'Auto-trigger fixes for audit findings'
    required: false
    default: 'false'

  audit_labels:
    description: 'Labels to apply to audit issues (comma-separated)'
    required: false
    default: 'audit'

  audit_target_dirs:
    description: 'Comma-separated list of directories to audit (randomly selected)'
    required: false

  opencode_version:
    description: 'OpenCode CLI version to use (e.g. "latest" or a specific tag like "v0.1.0")'
    required: false
    default: 'latest'

  git_user_name:
    description: 'Git user name for commits (default: GITHUB_ACTOR)'
    required: false

  git_user_email:
    description: 'Git user email for commits (default: GITHUB_ACTOR email)'
    required: false

  enable_state_cache:
    description: 'Whether to persist the learning database across runs using Actions Cache'
    required: false
    default: 'true'

  state_cache_key:
    description: 'Custom key prefix for saving/restoring the learning state'
    required: false
    default: 'opencode-learning-state'

  ci_failure_logs:
    description: 'CI failure logs for self-heal mode (required when mode=self-heal)'
    required: false

  failed_step:
    description: 'Name of the CI step that failed (for self-heal mode diagnostics)'
    required: false

  failed_workflow:
    description: 'Name of the workflow that failed (for self-heal mode diagnostics)'
    required: false

  cost_tracking_enabled:
    description: 'Expose token usage and cost data via step outputs, PR comment section, and .jsonl log'
    required: false
    default: 'false'

  cost_tracking_verbosity:
    description: 'Detail level for token/cost exposure: off, summary (totals), or detailed (totals + prompt/completion breakdown)'
    required: false
    default: 'summary'

  cost_tracking_input_cost_per_1k:
    description: 'Cost per 1K input tokens (USD) used for cost estimation'
    required: false

  cost_tracking_output_cost_per_1k:
    description: 'Cost per 1K output tokens (USD) used for cost estimation'
    required: false

outputs:
  review_summary:
    description: 'Summary of the review'
  verdict:
    description: 'Whether the PR is ready to merge'
  critical_count:
    description: 'Number of critical issues found'
  important_count:
    description: 'Number of important issues found'
  minor_count:
    description: 'Number of minor issues found'
  changes_made:
    description: 'Whether changes were made during fix'
  pr_url:
    description: 'URL of the created self-heal PR'
  verification_passed:
    description: 'Whether verification passed in the self-heal workflow'
  token_usage:
    description: 'Total tokens consumed during the review (when cost_tracking_enabled=true)'
  cost:
    description: 'Estimated cost of the review run in USD (when cost_tracking_enabled=true and computable)'

runs:
  using: 'node24'
  main: 'action/lib/index.js'
  post: 'action/lib/post/index.js'
