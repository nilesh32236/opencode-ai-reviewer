---
# OpenCode AI Reviewer — GitLab CI job template
# https://github.com/anomalyco/opencode-ai-reviewer
#
# To use this template in your project:
#   1. Copy this file to your repository as .gitlab-ci.yml (or include it)
#   2. Set GITLAB_TOKEN in your CI/CD variables (GitLab personal access token with api scope)
#   3. Set OPENCODE_API_KEY or other model provider keys as CI/CD variables
#
# The job runs automatically on every merge request. To skip review on a specific MR,
# add a label matching `skip_labels` (default: autofix, autofix:approved, autofix:merged).

opencode-review:
  stage: review
  # Pinned to the Node LTS floor (24.21.0) + digest so the job image cannot
  # silently drift below the floor via a floating tag or mirror lag.
  # Must stay in sync with docker/Dockerfile base pins.
  # Verify tag↔digest before changing:
  #   docker buildx imagetools inspect node:24.21.0-bookworm-slim
  image: node:24.21.0-bookworm-slim@sha256:5cbc7caba8c2c0f0bca675d1b61b9f2857e1cf1853c6164ee9dd409501a936e7
  variables:
    PLATFORM: "gitlab"
    GITLAB_TOKEN: ${GITLAB_TOKEN}
    INPUT_GITHUB_TOKEN: ${GITLAB_TOKEN}
    OPENCODE_API_KEY: ${OPENCODE_API_KEY}
    REVIEW_MODE: "review"
    OPENCODE_VERSION: "latest"
  script:
    - npx @opencode-pr-agent/action
  only:
    - merge_requests
  except:
    variables:
      - $CI_MERGE_REQUEST_LABELS =~ /.*autofix.*/
