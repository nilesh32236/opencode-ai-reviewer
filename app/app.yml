name: opencode-pr-agent
description: AI-powered PR review, auto-fix, and codebase audit using OpenCode
url: https://github.com/marketplace/opencode-pr-agent

default_events:
  - pull_request
  - pull_request_review_comment
  - issue_comment
  - issues
  - label

# Permission notes (least-privilege breakdown):
#
# GitHub App installation tokens are scoped to the MAXIMUM permissions the app
# declares; they cannot be narrowed per webhook. The values below therefore
# list the overall maximum the app needs. Per-mode requirements:
#
#   ReviewSubscriber (/review)          -> contents: read
#   AuditSubscriber (/audit)            -> contents: read
#   AnalyzeSubscriber (/analyze)        -> contents: read
#   FixSubscriber (/fix, autofix)       -> contents: write
#   DocsSubscriber (/docs)              -> contents: write   (opens a docs PR from a branch)
#
# `issues: write` and `pull_requests: write` are required by both read-only and
# autofix modes (for comments and PR/issue updates). `contents: write` is only
# exercised by autofix and the docs command — review/audit/analyze operate with
# `contents: read`.
# `checks: write` is required for the branch-protection check run (Checks API);
# existing installs must approve the newly requested permission when upgrading.
default_permissions:
  pull_requests: write   # required for review + autofix + docs (PR comments/updates)
  issues: write          # required for review + audit (issue comments/tracking)
  contents: write        # ONLY required for autofix (FixSubscriber) and /docs (DocsSubscriber); review/audit need read
  metadata: read         # required for repo/org lookup in all modes
  checks: write          # required for the OpenCode AI Reviewer check run (branch protection)
